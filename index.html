<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 寻夏 · 单文件版：无需服务器，双击或手机浏览器直接打开 -->
<title>寻夏 · 在千年遗址中，寻找消失的记忆</title>
<meta name="description" content="《寻夏》西夏陵遗址探索互动原型：探索 · 发现 · 修复 · 识别 · 收集 · 解锁">
<style>
/* ============================================================
   《寻夏》 — base.css
   设计语言：残片感 / 风沙感 / 考古档案感
   尺寸系统：--u = 舞台宽度的 1%（由 JS 计算），1u ≈ 16px @1600 宽
   ============================================================ */

:root{
  /* 尺寸单位 */
  --u: 16px;

  /* 夜与沙 */
  --ink:#0b0907;
  --night-1:#14100d;
  --night-2:#1d1611;
  --night-3:#2a2018;
  --dust:#c9a97a;
  --dust-2:#8d7048;
  --dust-3:#5d4a30;

  /* 金与印 */
  --gold:#c9a15c;
  --gold-hi:#f2debc;
  --seal:#9c3a26;
  --jade:#7f9d88;

  /* 档案纸 */
  --paper:#e8ddc5;
  --paper-2:#d5c6a6;
  --paper-3:#bfae8b;
  --paper-ink:#33291d;

  /* 线 */
  --line: rgba(233,216,180,.26);
  --line-strong: rgba(233,216,180,.5);
  --line-paper: rgba(51,41,29,.35);

  /* 阴影 / 光 */
  --glow: 0 0 calc(var(--u)*2.4) rgba(233,189,110,.45);
  --shadow-deep: 0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(0,0,0,.55);

  /* 字体 */
  --serif: "Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","Times New Roman",serif;
  --sans: "Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono: "JetBrains Mono","SFMono-Regular","Menlo","Consolas",monospace;

  --t-fast: .18s;
  --t-mid: .36s;
  --t-slow: .8s;
  --ease-out: cubic-bezier(.16,.84,.28,1);
  --ease-in-out: cubic-bezier(.5,.05,.3,1);
}

*,*::before,*::after{ box-sizing:border-box; }

/* 关键：自定义 display 不能覆盖 [hidden] */
[hidden]{ display:none !important; }

html,body{
  margin:0; padding:0; height:100%;
  background:#070605;
  color:var(--paper);
  font-family:var(--serif);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
}

body{ display:flex; align-items:center; justify-content:center; }

button{ font-family:inherit; color:inherit; background:none; border:0; cursor:pointer; }
/* 移动端：去掉双击缩放与 300ms 点击延迟 */
button,.prop,.hotspot,.lnode,.idcard,.opt,.slotcard,.hud-stat,.nav__item,.zoom-btn,.switch{
  touch-action:manipulation;
}
button:focus-visible,[tabindex]:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

/* ---------- 舞台 ---------- */
.stage{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  overflow:clip;          /* clip：不可被程序化滚动，保证 16:9 舞台稳定 */
  background:var(--ink);
  isolation:isolate;
  box-shadow:0 0 6vmin rgba(0,0,0,.9);
}

/* 移动端浏览器地址栏会吃掉 vh，改用 dvh（支持的浏览器才生效） */
@supports (height: 100dvh){
  .stage{
    width:min(100vw, calc(100dvh * 16 / 9));
    height:min(100dvh, calc(100vw * 9 / 16));
  }
}

/* ---------- 环境：风沙 / 颗粒 / 暗角 ---------- */
.fx-sand,.fx-grain,.fx-vignette{ position:absolute; inset:0; pointer-events:none; }
.fx-sand{ z-index:40; opacity:.5; mix-blend-mode:screen; }
.fx-sand__layer{
  position:absolute; inset:-30% -60%;
  background-repeat:repeat;
  will-change:transform;
}
.fx-sand__layer--a{
  background-image:radial-gradient(closest-side, rgba(226,196,142,.10), transparent 70%);
  background-size:calc(var(--u)*30) calc(var(--u)*9);
  animation:sandDriftA 46s linear infinite;
}
.fx-sand__layer--b{
  background-image:radial-gradient(closest-side, rgba(226,196,142,.07), transparent 70%);
  background-size:calc(var(--u)*17) calc(var(--u)*6);
  animation:sandDriftB 31s linear infinite;
  opacity:.85;
}
.fx-sand__layer--c{
  background-image:radial-gradient(closest-side, rgba(255,235,200,.06), transparent 70%);
  background-size:calc(var(--u)*7) calc(var(--u)*3);
  animation:sandDriftC 19s linear infinite;
}
.fx-grain{
  z-index:41; opacity:.16; mix-blend-mode:overlay;
  background-image:
    repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0 1deg, transparent 1deg 2deg),
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.05), transparent 60%);
  background-size:calc(var(--u)*3) calc(var(--u)*3), 100% 100%;
  animation:grainShift 1.1s steps(3) infinite;
}
.fx-vignette{
  z-index:42;
  background:radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.35) 78%, rgba(0,0,0,.72) 100%);
}

/* ---------- 屏幕层 ---------- */
.screen{ position:absolute; inset:0; z-index:10; overflow:clip; }

.s{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  animation:screenIn var(--t-slow) var(--ease-out) both;
}
.s--leaving{ animation:screenOut .34s var(--ease-in-out) both; }
.s--center{ align-items:center; justify-content:center; }

.s__bg{ position:absolute; inset:0; z-index:0; overflow:hidden; }
.s__bg svg{ position:absolute; inset:0; width:100%; height:100%; }
.s__content{ position:relative; z-index:5; display:flex; flex-direction:column; }
.s__top{ position:absolute; top:calc(var(--u)*7); left:0; right:0; z-index:6; text-align:center; }
.s__bottom{ position:absolute; bottom:calc(var(--u)*6); left:0; right:0; z-index:6; display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1.2); }

/* ---------- 文字 ---------- */
.t-kicker{
  font-family:var(--sans);
  font-size:calc(var(--u)*1.15); letter-spacing:.52em; text-indent:.52em;
  color:var(--gold); text-transform:uppercase;
}
.t-display{
  font-size:calc(var(--u)*13); line-height:1;
  letter-spacing:.16em; text-indent:.16em;
  color:var(--paper);
  text-shadow:0 0 calc(var(--u)*4) rgba(233,189,110,.35), 0 calc(var(--u)*.3) 0 rgba(0,0,0,.6);
}
.t-h1{ font-size:calc(var(--u)*4.2); letter-spacing:.12em; line-height:1.25; }
.t-h2{ font-size:calc(var(--u)*2.9); letter-spacing:.1em; line-height:1.3; }
.t-h3{ font-size:calc(var(--u)*2.1); letter-spacing:.08em; line-height:1.4; }
.t-body{ font-size:calc(var(--u)*1.62); line-height:1.9; letter-spacing:.06em; color:rgba(232,221,197,.9); }
.t-cap{ font-size:calc(var(--u)*1.3); line-height:1.7; letter-spacing:.14em; color:rgba(232,221,197,.62); }
.t-archive{
  font-family:var(--mono); font-size:calc(var(--u)*1.24); letter-spacing:.18em;
  color:rgba(232,221,197,.72);
}
.t-quote{ font-size:calc(var(--u)*1.72); line-height:2; letter-spacing:.1em; color:var(--gold-hi); }
.t-gold{ color:var(--gold); }
.t-dim{ color:rgba(232,221,197,.5); }
.t-seal{ color:var(--seal); }
.t-center{ text-align:center; }
.t-shadow{ text-shadow:0 calc(var(--u)*.2) calc(var(--u)*1.2) rgba(0,0,0,.75); }
.t-wrap{ max-width:calc(var(--u)*62); }
.t-italic{ font-style:italic; }

/* ---------- 按钮 ---------- */
.btn{
  position:relative;
  display:inline-flex; align-items:center; justify-content:center; gap:calc(var(--u)*.9);
  padding:calc(var(--u)*1.55) calc(var(--u)*4);
  font-size:calc(var(--u)*1.8); letter-spacing:.26em; text-indent:.26em;
  color:var(--paper);
  background:linear-gradient(180deg, rgba(56,43,30,.92), rgba(30,23,17,.94));
  border:1px solid var(--line-strong);
  clip-path:polygon(2% 12%, 6% 0, 94% 3%, 100% 16%, 98% 88%, 92% 100%, 7% 96%, 0 82%);
  transition:transform var(--t-fast) var(--ease-out), color var(--t-fast), box-shadow var(--t-mid), background var(--t-mid);
}
.btn::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(233,189,110,.16), transparent 60%);
  opacity:0; transition:opacity var(--t-mid);
}
.btn:hover{ color:var(--gold-hi); box-shadow:var(--glow); transform:translateY(calc(var(--u)*-.2)); }
.btn:hover::after{ opacity:1; }
.btn:active{ transform:translateY(0) scale(.985); }

.btn--primary{
  color:#2a1d10;
  background:linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #a67e3f);
  border-color:rgba(255,240,205,.6);
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
.btn--primary:hover{ color:#1c1309; box-shadow:0 0 calc(var(--u)*3) rgba(233,189,110,.6); }

.btn--ghost{
  background:transparent;
  border-color:var(--line);
  color:rgba(232,221,197,.85);
}
.btn--sm{ padding:calc(var(--u)*1) calc(var(--u)*2.4); font-size:calc(var(--u)*1.4); }
.btn--wide{ min-width:calc(var(--u)*30); }
.btn[disabled],.btn.is-disabled{
  opacity:.38; pointer-events:none; filter:grayscale(.6);
}
.btn.is-pulse{ animation:btnPulse 2.4s var(--ease-in-out) infinite; }

/* 次要文字按钮 */
.link{
  font-size:calc(var(--u)*1.4); letter-spacing:.24em; color:rgba(232,221,197,.62);
  border-bottom:1px dashed rgba(232,221,197,.3); padding-bottom:calc(var(--u)*.3);
  transition:color var(--t-fast), border-color var(--t-fast);
}
.link:hover{ color:var(--gold); border-color:var(--gold); }

/* ---------- 碎片卡片 / 档案卡 ---------- */
.card{
  position:relative;
  padding:calc(var(--u)*2.8) calc(var(--u)*3);
  background:linear-gradient(160deg, rgba(38,29,21,.94), rgba(20,15,11,.96));
  border:1px solid var(--line);
  clip-path:polygon(1.4% 4%, 5% 0, 96% 1.6%, 100% 8%, 99% 94%, 95% 100%, 3% 98.4%, 0 92%);
}
.card--paper{
  background:
    linear-gradient(180deg, rgba(255,255,255,.25), transparent 30%),
    linear-gradient(160deg, var(--paper), var(--paper-2));
  color:var(--paper-ink);
  border-color:rgba(51,41,29,.4);
  box-shadow:var(--shadow-deep);
}
.card--paper::before{
  content:""; position:absolute; inset:calc(var(--u)*.9);
  border:1px dashed var(--line-paper);
  pointer-events:none;
}
.card__no{
  font-family:var(--mono); font-size:calc(var(--u)*1.2); letter-spacing:.2em;
  color:rgba(232,221,197,.55);
}
.card--paper .card__no{ color:rgba(51,41,29,.6); }

.seal{
  display:inline-flex; align-items:center; justify-content:center;
  padding:calc(var(--u)*.5) calc(var(--u)*1);
  color:var(--seal); border:1px solid var(--seal);
  font-size:calc(var(--u)*1.1); letter-spacing:.16em;
  transform:rotate(-4deg);
  opacity:.9;
}
.seal--big{ font-size:calc(var(--u)*2); padding:calc(var(--u)*1) calc(var(--u)*1.6); letter-spacing:.28em; }

/* 关键词标签 */
.chip{
  display:inline-flex; align-items:center; gap:calc(var(--u)*.6);
  padding:calc(var(--u)*.55) calc(var(--u)*1.4);
  font-size:calc(var(--u)*1.3); letter-spacing:.18em;
  color:rgba(232,221,197,.85);
  border:1px solid var(--line);
  background:rgba(0,0,0,.25);
  clip-path:polygon(0 18%, 4% 0, 96% 4%, 100% 22%, 98% 82%, 94% 100%, 3% 96%, 0 78%);
}
.chip--gold{ color:var(--gold-hi); border-color:rgba(233,189,110,.55); }
.chip--locked{ color:rgba(232,221,197,.35); border-style:dashed; }

/* 划线分隔 */
.rule{
  height:1px; width:100%;
  background:linear-gradient(90deg, transparent, var(--line-strong), transparent);
  margin:calc(var(--u)*2) 0;
}

/* ---------- HUD ---------- */
.hud{
  position:absolute; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:calc(var(--u)*2.2) calc(var(--u)*3.2);
  pointer-events:none;
  background:linear-gradient(180deg, rgba(9,7,6,.85), transparent);
}
.hud__left{ display:flex; align-items:center; gap:calc(var(--u)*1.6); pointer-events:auto; }
.hud__back{
  width:calc(var(--u)*4.4); height:calc(var(--u)*4.4);
  display:grid; place-items:center;
  border:1px solid var(--line); color:rgba(232,221,197,.8);
  clip-path:polygon(8% 0,100% 6%,94% 100%,0 92%);
  transition:color var(--t-fast), border-color var(--t-fast), background var(--t-fast);
  font-size:calc(var(--u)*1.8);
}
.hud__back:hover{ color:var(--gold-hi); border-color:var(--gold); background:rgba(233,189,110,.12); }
.hud__chapter{ display:flex; flex-direction:column; gap:calc(var(--u)*.4); }
.hud__chapter b{ font-weight:400; font-size:calc(var(--u)*1.7); letter-spacing:.2em; color:var(--paper); }
.hud__chapter span{ font-family:var(--mono); font-size:calc(var(--u)*1.1); letter-spacing:.22em; color:rgba(232,221,197,.55); }
.hud__right{ display:flex; align-items:center; gap:calc(var(--u)*1.4); pointer-events:auto; }
.hud-stat{
  display:flex; align-items:center; gap:calc(var(--u)*.8);
  padding:calc(var(--u)*.7) calc(var(--u)*1.4);
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(30,23,17,.9), rgba(12,9,7,.9));
  clip-path:polygon(4% 0,100% 4%,96% 100%,0 94%);
  font-size:calc(var(--u)*1.35); letter-spacing:.14em;
  transition:box-shadow var(--t-mid), transform var(--t-mid);
}
.hud-stat svg{ width:calc(var(--u)*1.7); height:calc(var(--u)*1.7); }
.hud-stat b{ font-weight:400; color:var(--gold-hi); font-family:var(--mono); letter-spacing:.06em; }
.hud-stat.is-flash{ animation:hudFlash 1.1s var(--ease-out); }
.hud-stat.is-clickable{ cursor:pointer; }
.hud-stat.is-clickable:hover{ box-shadow:var(--glow); transform:translateY(calc(var(--u)*-.2)); }

/* ---------- 底部导航 ---------- */
.nav{
  position:absolute; bottom:calc(var(--u)*2.4); left:50%; transform:translateX(-50%);
  z-index:30; display:flex; align-items:center; gap:calc(var(--u)*.6);
  padding:calc(var(--u)*.8);
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(28,21,16,.94), rgba(10,8,6,.96));
  clip-path:polygon(1% 10%, 4% 0, 96% 3%, 100% 14%, 98% 90%, 95% 100%, 4% 97%, 0 86%);
  box-shadow:var(--shadow-deep);
  backdrop-filter:blur(6px);
}
.nav__item{
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*.5);
  min-width:calc(var(--u)*11); padding:calc(var(--u)*1) calc(var(--u)*1.6);
  color:rgba(232,221,197,.58);
  font-size:calc(var(--u)*1.35); letter-spacing:.24em; text-indent:.24em;
  transition:color var(--t-fast), background var(--t-fast);
}
.nav__item svg{ width:calc(var(--u)*2.2); height:calc(var(--u)*2.2); opacity:.9; }
.nav__item:hover{ color:var(--gold-hi); background:rgba(233,189,110,.08); }
.nav__item.is-on{ color:var(--gold-hi); }
.nav__item.is-on::after{
  content:""; position:absolute; bottom:calc(var(--u)*-.2); left:22%; right:22%;
  height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ---------- Toast ---------- */
.toast-stack{
  position:absolute; bottom:calc(var(--u)*13); left:0; right:0; z-index:60;
  display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1);
  pointer-events:none;
}
.toast{
  max-width:calc(var(--u)*70);
  padding:calc(var(--u)*1.3) calc(var(--u)*2.6);
  background:linear-gradient(180deg, rgba(34,26,19,.96), rgba(14,11,8,.97));
  border:1px solid var(--line-strong);
  clip-path:polygon(1% 14%,3% 0,97% 4%,100% 20%,99% 86%,96% 100%,3% 96%,0 82%);
  font-size:calc(var(--u)*1.5); letter-spacing:.1em; color:var(--paper);
  box-shadow:var(--shadow-deep);
  animation:toastIn .4s var(--ease-out) both;
}
.toast.is-out{ animation:toastOut .4s var(--ease-in-out) both; }
.toast--gold{ border-color:rgba(233,189,110,.7); box-shadow:var(--glow); color:var(--gold-hi); }
.toast--warn{ border-color:rgba(156,58,38,.7); }

/* ---------- Modal ---------- */
.modal-root{
  position:absolute; inset:0; z-index:70;
  display:grid; place-items:center;
  background:rgba(6,5,4,.72);
  backdrop-filter:blur(3px);
  animation:fadeIn .3s var(--ease-out) both;
}
.modal-root.is-out{ animation:fadeOut .3s var(--ease-in-out) both; }
.modal{
  position:relative;
  width:min(calc(var(--u)*72), 88%);
  max-height:82%;
  overflow:auto;
  padding:calc(var(--u)*3.4) calc(var(--u)*3.6);
  background:linear-gradient(165deg, rgba(40,31,22,.98), rgba(16,12,9,.99));
  border:1px solid var(--line-strong);
  clip-path:polygon(1% 3%, 4% 0, 97% 1%, 100% 6%, 99% 95%, 96% 100%, 3% 99%, 0 94%);
  box-shadow:var(--shadow-deep);
  animation:modalIn .42s var(--ease-out) both;
}
.modal::-webkit-scrollbar{ width:calc(var(--u)*.5); }
.modal::-webkit-scrollbar-thumb{ background:var(--line-strong); }
.modal__title{ font-size:calc(var(--u)*2.4); letter-spacing:.14em; margin:0 0 calc(var(--u)*1.6); }
.modal__body{ font-size:calc(var(--u)*1.6); line-height:1.95; letter-spacing:.05em; color:rgba(232,221,197,.88); }
.modal__acts{ display:flex; justify-content:flex-end; gap:calc(var(--u)*1.4); margin-top:calc(var(--u)*3); flex-wrap:wrap; }

/* ---------- 转场 veil ---------- */
.veil{
  position:absolute; inset:0; z-index:80;
  opacity:0; pointer-events:none;
  transition:opacity .42s var(--ease-out);
}
.veil.is-on{ opacity:1; }
.veil__l{
  position:absolute; inset:-25% -70%;
  background-repeat:repeat-x;
  will-change:transform;
}
.veil__l--a{
  background-image:radial-gradient(closest-side, rgba(214,180,124,.85), transparent 68%);
  background-size:calc(var(--u)*26) calc(var(--u)*12);
  animation:veilSweepA .95s var(--ease-in-out) both;
}
.veil__l--b{
  background-image:radial-gradient(closest-side, rgba(160,126,78,.8), transparent 70%);
  background-size:calc(var(--u)*40) calc(var(--u)*18);
  animation:veilSweepB 1.05s var(--ease-in-out) both;
}
.veil__l--c{
  background-image:radial-gradient(closest-side, rgba(120,92,56,.9), transparent 72%);
  background-size:calc(var(--u)*18) calc(var(--u)*26);
  animation:veilSweepC .9s var(--ease-in-out) both;
}
.veil__l--d{
  background:linear-gradient(90deg, rgba(24,18,12,.2), rgba(58,44,29,.92) 45%, rgba(24,18,12,.2));
  animation:veilSweepB 1.05s .05s var(--ease-in-out) both;
}
.veil__grain{
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(92deg, rgba(255,240,210,.06) 0 2px, transparent 2px 5px);
  opacity:0; animation:veilGrain 1.1s steps(4) both;
}

/* 章节卡片（转场时浮现） */
.chapter-card{
  position:absolute; inset:0; z-index:85;
  display:grid; place-items:center;
  opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease-out);
}
.chapter-card.is-on{ opacity:1; }
.chapter-card__in{
  text-align:center;
  animation:chapterIn .7s var(--ease-out) both;
}

/* ---------- 竖屏提示 ---------- */
.rotate-hint{
  position:fixed; inset:0; z-index:99;
  display:grid; place-items:center; background:rgba(6,5,4,.94);
}
.rotate-hint__box{ text-align:center; color:var(--gold-hi); font-size:16px; letter-spacing:.2em; }
.rotate-hint__icon{ font-size:42px; animation:spinSlow 3.6s linear infinite; }

/* ---------- 通用小工具 ---------- */
.row{ display:flex; align-items:center; gap:calc(var(--u)*1.6); }
.col{ display:flex; flex-direction:column; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1; }
.hidden{ display:none !important; }
.rel{ position:relative; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:calc(var(--u)*2); }

/* 残片高亮环 */
.halo{

];

  return CUTS.map(c => {
    const xs = c.pts.map(p=>p[0]), ys = c.pts.map(p=>p[1]);
    const x = Math.min.apply(null,xs), y = Math.min.apply(null,ys);
    const w = Math.max.apply(null,xs) - x, h = Math.max.apply(null,ys) - y;
    return {
      index:c.id,
      points: c.pts.map(p=>p.join(',')).join(' '),
      box:[x,y,w,h],
      center:[x + w/2, y + h/2]
    };
  });
};

A.glyphSvg = function(gid, opts){
  const o = opts || {};
  const g = X.DATA.glyphs[gid];
  const omit = o.only ? [] : (o.omit || []);
  const color = o.color || '#e6cfa4';
  const sw = o.width || 3.4;
  const parts = g.strokes.filter(s => omit.indexOf(s.id) < 0).map(s =>
    `<path d="${s.d}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-linecap="square" stroke-linejoin="miter"
      ${o.trace?'stroke-dasharray="400" stroke-dashoffset="400" style="animation:motifTrace 1.2s var(--ease-out) forwards"':''}/>`);
  const extra = o.hint ? `<path d="${g.strokes[0].d}" fill="none" stroke="rgba(233,189,110,.25)" stroke-width="1.4"/>` : '';
  return svgWrap('0 0 100 100', extra + parts.join(''), 'preserveAspectRatio="xMidYMid meet"');
};
A.glyphStrokeSvg = function(gid, sid){
  const g = X.DATA.glyphs[gid];

  return svgWrap(b.join(' '), `<path d="${s.d}" fill="none" stroke="#e6cfa4" stroke-width="3.4" stroke-linecap="square"/>`,

<script>
/* ============================================================
   《寻夏》 — core.js
   状态 / 存档 / 事件 / 路由（风沙转场）/ 音效 / 进度推导
   ============================================================ */
(function(){
const X = window.X;
const SAVE_KEY = 'xunxia.save.v1';

/* ------------------------------------------------------------
   1. 状态
   ------------------------------------------------------------ */
const DEFAULT_STATE = {
  v: 1,
  identity: null,
  started: false,
  opened: false,            // 是否看过开场
  relics: {},               // relic01:{found,clues:{},judged,restored,archived}
  glyphs: {},               // g1:{matched:true}
  glyphRepairDone: false,
  siteClues: {},            // c1:true
  planDone: false,
  vaultOpen: false,
  links: {},                // relic:'life'
  networkDone: false,
  gateOpen: false,
  mosaicDone: false,
  regenerated: false,
  cardMade: false,
  visited: {},
  counters: { clicks:0, wrongJudgements:0, wrongDrops:0 },
  settings: { sfx: true }
};

let state = clone(DEFAULT_STATE);

function clone(o){ return JSON.parse(JSON.stringify(o)); }
X.clone = clone;

X.state = function(){ return state; };
X.save = function(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){}
};
X.load = function(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const obj = JSON.parse(raw);
    state = Object.assign(clone(DEFAULT_STATE), obj);
    return true;
  } catch(e){ return false; }
};
X.reset = function(){
  state = clone(DEFAULT_STATE);
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  X.emit('state:reset');
  X.save();
};
X.hasSave = function(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
};

/* 遗珍条目读写 */
X.relic = function(id){
  if (!state.relics[id]) state.relics[id] = { found:false, clues:{}, judged:false, restored:false, archived:false };
  return state.relics[id];
};

/* 任务 / 解锁标记 */
X.flag = function(id){
  switch(id){
    case 'identity':     return !!state.identity;
    case 'started':      return !!state.started;
    case 'relic01':      return !!X.relic('relic01').found;
    case 'clue3':        return Object.keys(X.relic('relic01').clues).length >= 3;
    case 'judge01':      return !!X.relic('relic01').judged;
    case 'repair01':     return !!X.relic('relic01').restored;
    case 'archived01':   return !!X.relic('relic01').archived;
    case 'glyphMatch':   return X.DATA.glyphOrder.every(g => state.glyphs[g] && state.glyphs[g].matched);
    case 'glyphRepair':  return !!state.glyphRepairDone;
    case 'siteClues':    return X.DATA.gardenScene.clues.every(c => state.siteClues[c.id]);
    case 'planDone':     return !!state.planDone;
    case 'vaultOpen':    return !!state.vaultOpen;
    case 'networkDone':  return !!state.networkDone;
    case 'gateOpen':     return !!state.gateOpen;
    case 'mosaicDone':   return !!state.mosaicDone;
    case 'regenerated':  return !!state.regenerated;
    case 'cardMade':     return !!state.cardMade;
  }
  return !!state[id];
};

/* 区域解锁 */
X.regionUnlocked = function(region){
  switch(region.id){
    case 'gate':   return true;
    case 'stele':  return X.flag('archived01');
    case 'garden': return X.flag('glyphMatch') && X.flag('glyphRepair');
    case 'vault':  return X.flag('planDone');
    case 'door':   return X.flag('networkDone');
  }
  return false;
};
X.regionDone = function(region){
  switch(region.id){
    case 'gate':   return X.flag('archived01');
    case 'stele':  return X.flag('glyphRepair');
    case 'garden': return X.flag('planDone');
    case 'vault':  return X.flag('networkDone');
    case 'door':   return X.flag('mosaicDone');
  }
  return false;
};
/* 当前主线引导 */
X.nextRegion = function(){
  const list = X.DATA.regions;
  for (let i = 0; i < list.length; i++){
    if (!X.regionDone(list[i])) return list[i];
  }
  return list[list.length - 1];
};

/* 收集进度（碎片 12 件） */
X.shardsTotal = function(){ return 12; };
X.shardsFound = function(){
  let n = 0;
  X.DATA.relicOrder.forEach(id => { if (X.relic(id).archived) n++; });
  X.DATA.glyphOrder.forEach(g => { if (state.glyphs[g] && state.glyphs[g].matched) n++; });
  X.DATA.gardenScene.clues.forEach(c => { if (state.siteClues[c.id]) n++; });
  if (state.mosaicDone) n++;
  return n;
};
/* 记忆值：所有线索的累计 */
X.memoryValue = function(){
  let n = 0;
  X.DATA.relicOrder.forEach(id => {
    const r = X.relic(id);
    if (r.found) n += 2;
    n += Object.keys(r.clues || {}).length;
    if (r.judged) n += 2;
    if (r.restored) n += 3;
  });
  X.DATA.glyphOrder.forEach(g => { if (state.glyphs[g] && state.glyphs[g].matched) n += 3; });
  if (state.glyphRepairDone) n += 4;
  X.DATA.gardenScene.clues.forEach(c => { if (state.siteClues[c.id]) n += 3; });
  if (state.planDone) n += 5;
  n += Object.keys(state.links).length * 4;
  if (state.networkDone) n += 8;
  if (state.mosaicDone) n += 12;
  return n;
};
/* 探索进度百分比 */
X.progress = function(){
  const flags = ['identity','started','relic01','clue3','judge01','repair01','archived01',
                 'glyphMatch','glyphRepair','siteClues','planDone','vaultOpen','networkDone',
                 'gateOpen','mosaicDone','regenerated','cardMade'];
  const done = flags.filter(f => X.flag(f)).length;
  return Math.round(done / flags.length * 100);
};
/* 各章统计数据（S22 / S24） */
X.summary = function(){
  const relics = X.DATA.relicOrder.filter(id => X.relic(id).archived).length;
  const glyphs = X.DATA.glyphOrder.filter(g => state.glyphs[g] && state.glyphs[g].matched).length;
  const sites  = X.DATA.gardenScene.clues.filter(c => state.siteClues[c.id]).length;
  let repairs = 0;
  X.DATA.relicOrder.forEach(id => { if (X.relic(id).restored) repairs++; });
  if (state.glyphRepairDone) repairs++;
  return { relics, glyphs, sites, repairs, memory: X.memoryValue(), progress: X.progress() };
};

/* ------------------------------------------------------------
   2. 事件总线
   ------------------------------------------------------------ */
const bus = {};
X.on = function(evt, fn){ (bus[evt] = bus[evt] || []).push(fn); return () => X.off(evt, fn); };
X.off = function(evt, fn){
  if (!bus[evt]) return;
  bus[evt] = bus[evt].filter(f => f !== fn);
};
X.emit = function(evt, payload){
  (bus[evt] || []).forEach(fn => { try { fn(payload); } catch(e){ console.warn(e); } });
};

/* ------------------------------------------------------------
   3. DOM 尺寸单位（--u）
   ------------------------------------------------------------ */
const stage = document.getElementById('stage');
X.stage = function(){ return stage; };
X.unit = function(){
  return stage.clientWidth / 100;
};
X.ux = function(n){ return stage.clientWidth * n / 100; };
function applyUnit(){
  const u = X.unit();
  document.documentElement.style.setProperty('--u', u + 'px');
}
X.applyUnit = applyUnit;
window.addEventListener('resize', applyUnit, { passive:true });

/* ------------------------------------------------------------
   4. 定时器（随屏销毁）
   ------------------------------------------------------------ */
let timers = [];
X.delay = function(ms){
  return new Promise(resolve => {
    const t = setTimeout(() => { resolve(); }, ms);
    timers.push(t);
  });
};
X.later = function(fn, ms){
  const t = setTimeout(() => { fn(); }, ms);
  timers.push(t);
  return t;
};
X.loop = function(fn, ms){
  const t = setInterval(fn, ms);
  timers.push(t);
  return t;
};
X.clearTimers = function(){
  timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  timers = [];
};

/* ------------------------------------------------------------
   5. 音效（WebAudio 合成，无音频文件）
   ------------------------------------------------------------ */
let actx = null;
function ac(){
  if (!state.settings.sfx) return null;
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, gain, delay, sweep){
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + (delay || 0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if (sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(40, sweep), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain == null ? .12 : gain, t0 + Math.min(.03, dur/3));
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(g).connect(c.destination);
  osc.start(t0); osc.stop(t0 + dur + .05);
}
function noise(dur, gain, freq, q){
  const c = ac(); if (!c) return;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = freq || 900; bp.Q.value = q || 1.2;
  const g = c.createGain(); g.gain.value = gain == null ? .16 : gain;
  src.connect(bp).connect(g).connect(c.destination);
  src.start();
}
X.sfx = {
  resume(){ ac(); },
  tick(){ tone(1180, .07, 'triangle', .07); },
  hover(){ tone(760, .05, 'sine', .03); },
  ok(){ tone(660, .16, 'sine', .1); tone(990, .2, 'sine', .08, .08); },
  chime(){ [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>tone(f, .9, 'sine', .07, i*.11)); },
  snap(){ noise(.09, .22, 1800, 2.4); tone(180, .12, 'square', .07); },
  whoosh(){ noise(1.1, .13, 420, .7); },
  fail(){ tone(320, .28, 'sawtooth', .07, 0, 150); },
  crack(){ noise(.2, .2, 1200, 1.1); tone(90, .35, 'triangle', .09); },
  stamp(){ noise(.18, .26, 260, .9); }
};

/* ------------------------------------------------------------
   6. 路由 + 风沙转场
   ------------------------------------------------------------ */
const screens = {};
const history = [];
let current = null;
let busy = false;
const screenEl = document.getElementById('screen');
const veil = document.getElementById('veil');
const chapterCard = document.getElementById('chapterCard');

X.SCREENS = screens;
X.registerScreen = function(id, def){ screens[id] = def; };
X.current = function(){ return current; };

X.go = function(id, params){
  if (busy || !screens[id]) return Promise.resolve();
  busy = true;
  const def = screens[id];
  X.save();

  /* 转场：风沙掩过 → 换屏 → 风沙散去 */
  veil.classList.add('is-on');
  X.sfx.whoosh();

  return X.delay(430).then(() => {
    if (current && screens[current] && screens[current].unmount){
      try { screens[current].unmount(); } catch(e){}
    }
    X.clearTimers();
    screenEl.innerHTML = '';
    if (current && id !== current && !def.noHistory) history.push(current);
    current = id;
    state.visited[id] = true;
    document.getElementById('hud').hidden = true;
    document.getElementById('nav').hidden = true;
    const node = document.createElement('section');
    node.className = 's ' + (def.className || '');
    screenEl.appendChild(node);
    try {
      def.mount(node, params || {});
    } catch (err){
      console.error('[screen error]', id, err);
      node.innerHTML = '<div class="s--center" style="padding:8%"><p class="t-h3">这一屏出现了一点问题。</p><p class="t-cap">' + (err && err.message) + '</p></div>';
    }
    X.emit('screen', id);
    return X.delay(430);
  }).then(() => {
    veil.classList.remove('is-on');
    busy = false;
    X.emit('transition:end', id);
  });
};

X.back = function(fallback){
  const prev = history.pop();
  if (prev && screens[prev]) return X.go(prev);
  return X.go(fallback || 's04');
};

/* 转场时浮现章节名 */
X.chapterFlash = function(kicker, title){
  chapterCard.innerHTML = '<div class="chapter-card__in"><div class="t-kicker">' + kicker +
    '</div><div class="t-h1 t-center" style="margin-top:.6em">' + title + '</div></div>';
  chapterCard.classList.add('is-on');
  return X.delay(1100).then(() => {
    chapterCard.classList.remove('is-on');
    return X.delay(420);
  });
};

/* ------------------------------------------------------------
   7. 初始化
   ------------------------------------------------------------ */
X.boot = function(){
  applyUnit();
  const saved = X.load();
  if (saved) X.emit('state:loaded');
  X.emit('boot');
};

/* 焦点/滚动保护：键盘遍历或自动滚动时，舞台不允许位移 */
function resetStageScroll(){
  const sc = document.getElementById('screen');
  if (sc){ sc.scrollTop = 0; sc.scrollLeft = 0; }
  const st = document.getElementById('stage');
  if (st){ st.scrollTop = 0; st.scrollLeft = 0; }
}
X.resetStageScroll = resetStageScroll;
X.on('screen', resetStageScroll);
window.addEventListener('scroll', resetStageScroll, { passive:true });
document.addEventListener('focusin', () => setTimeout(resetStageScroll, 0));

/* 竖屏提示 */
function checkOrientation(){
  const hint = document.getElementById('rotateHint');
  /* 仅在窄屏竖屏时提示，且自动消失，避免遮挡 */
  const portrait = window.innerHeight > window.innerWidth && window.innerWidth < 560;
  if (portrait && hint.hidden){
    hint.hidden = false;
    clearTimeout(hint._t);
    hint._t = setTimeout(() => { hint.hidden = true; }, 3200);
  } else if (!portrait){
    hint.hidden = true;
  }
}
window.addEventListener('resize', checkOrientation, { passive:true });
X.checkOrientation = checkOrientation;

document.addEventListener('DOMContentLoaded', () => {
  const hint = document.getElementById('rotateHint');
  if (hint) hint.addEventListener('click', () => { hint.hidden = true; });
});

})();

<script>
/* ============================================================
   《寻夏》 — ui.js
   DOM 工具 / 通用组件 / HUD / 拖拽引擎 / 拼图引擎 / 动效工具
   ============================================================ */
(function(){
const X = window.X;

/* ------------------------------------------------------------
   1. DOM 工具
   ------------------------------------------------------------ */
function el(tag, attrs){
  const node = document.createElement(tag);
  const a = attrs || {};
  Object.keys(a).forEach(k => {
    const v = a[k];
    if (k === 'class' || k === 'className') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'style' && typeof v === 'object'){
      Object.keys(v).forEach(s => {
        /* 同时支持 camelCase 与 kebab-case（setProperty 不识别 camelCase） */
        if (s in node.style && s.indexOf('-') < 0) node.style[s] = v[s];
        else node.style.setProperty(s.replace(/[A-Z]/g, m => '-' + m.toLowerCase()), v[s]);
      });
    } else if (k === 'on' && typeof v === 'object'){
      Object.keys(v).forEach(evt => node.addEventListener(evt, v[evt]));
    } else if (k === 'data' && typeof v === 'object'){
      Object.keys(v).forEach(d => { node.dataset[d] = v[d]; });
    } else if (v === true) node.setAttribute(k, '');
    else if (v !== false && v != null) node.setAttribute(k, v);
  });
  for (let i = 2; i < arguments.length; i++){
    const kid = arguments[i];
    if (kid == null || kid === false) continue;
    if (Array.isArray(kid)) kid.forEach(k => k && node.appendChild(typeof k === 'string' ? document.createTextNode(k) : k));
    else node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return node;
}
X.el = el;

/* 由 HTML 字符串创建元素（用于注入 SVG 美术） */
function node(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
X.node = node;
/* 取 HTML 片段的 outerHTML（用于把 SVG 字符串放回字符串模板） */
X.wrap = function(html, cls){
  return '<div class="' + (cls || '') + '">' + html + '</div>';
};

X.u = function(n){ return 'calc(var(--u) * ' + n + ')'; };

/* ------------------------------------------------------------
   2. 通用组件
   ------------------------------------------------------------ */
X.btn = function(label, o){
  const opt = o || {};
  const cls = ['btn'];
  if (opt.variant === 'primary') cls.push('btn--primary');
  if (opt.variant === 'ghost') cls.push('btn--ghost');
  if (opt.size === 'sm') cls.push('btn--sm');
  if (opt.wide) cls.push('btn--wide');
  if (opt.pulse) cls.push('is-pulse');
  if (opt.className) cls.push(opt.className);
  const b = el('button', {
    class: cls.join(' '),
    type: 'button',
    on: {
      click(e){
        if (b.disabled) return;
        X.sfx.tick();
        if (opt.onClick) opt.onClick(e);
      },
      mouseenter(){ if (!b.disabled) X.sfx.hover(); }
    }
  }, label);
  if (opt.disabled) b.disabled = true;
  return b;
};

X.link = function(label, onClick){
  return el('button', { class: 'link', type: 'button', on: { click: onClick } }, label);
};

X.chip = function(label, kind){
  return el('span', { class: 'chip' + (kind ? ' chip--' + kind : '') }, label);
};

X.toast = function(text, o){
  const opt = o || {};
  const stack = document.getElementById('toasts');
  const t = el('div', { class: 'toast' + (opt.type ? ' toast--' + opt.type : '') }, text);
  stack.appendChild(t);
  const ms = opt.ms || (opt.type === 'warn' ? 2600 : 2100);
  X.later(() => {
    t.classList.add('is-out');
    X.later(() => t.remove(), 420);
  }, ms);
  return t;
};

/* 通用弹窗 */
X.modal = function(cfg){
  const root = document.getElementById('modal');
  root.innerHTML = '';
  root.hidden = false;
  const box = el('div', { class: 'modal', style: { width: cfg.width ? X.u(cfg.width) : null } });
  if (cfg.title) box.appendChild(el('h3', { class: 'modal__title', html: cfg.title }));
  const body = el('div', { class: 'modal__body' });
  if (typeof cfg.body === 'string') body.innerHTML = cfg.body;
  else if (cfg.body) body.appendChild(cfg.body);
  box.appendChild(body);

  function close(){
    root.classList.add('is-out');
    X.later(() => {
      root.hidden = true;
      root.classList.remove('is-out');
      root.innerHTML = '';
      if (cfg.onClose) cfg.onClose();
    }, 300);
  }

  const acts = el('div', { class: 'modal__acts' });
  (cfg.actions || [{ label:'继续' }]).forEach(a => {
    acts.appendChild(X.btn(a.label, {
      variant: a.variant || 'primary',
      size: a.size,
      onClick(){ if (a.onClick) a.onClick(close); else close(); }
    }));
  });
  box.appendChild(acts);
  root.appendChild(box);
  if (cfg.dismiss !== false){
    root.addEventListener('click', e => { if (e.target === root) close(); }, { once:true });
  }
  X.sfx.tick();
  return { close, box, body };
};

/* ------------------------------------------------------------
   3. HUD / 导航
   ------------------------------------------------------------ */
X.hud = function(cfg){
  const h = document.getElementById('hud');
  h.innerHTML = '';
  h.hidden = false;
  const left = el('div', { class: 'hud__left' });
  if (cfg.back){
    left.appendChild(el('button', {
      class: 'hud__back', type: 'button', html: '‹', title: '返回',
      on: { click(){ X.sfx.tick(); X.back(cfg.backTo); } }
    }));
  }
  if (cfg.chapter){
    left.appendChild(el('div', { class: 'hud__chapter' },
      el('b', { text: cfg.chapter }),
      cfg.tag ? el('span', { text: cfg.tag }) : null));
  }
  h.appendChild(left);

  const right = el('div', { class: 'hud__right' });
  const shard = el('div', {
    class: 'hud-stat' + (cfg.onShard ? ' is-clickable' : ''),
    title: '已收集碎片',
    on: { click(){ if (cfg.onShard) cfg.onShard(); } }
  }, node(X.ART.icon('shard')), el('span', { text: '碎片' }),
     el('b', { text: String(X.shardsFound()).padStart(2,'0') + '/' + X.shardsTotal() }));
  const mem = el('div', { class: 'hud-stat', title: '记忆值' },
    node(X.ART.icon('memory')), el('span', { text: '记忆值' }),
    el('b', { text: String(X.memoryValue()) }));
  shard.dataset.role = 'shard';
  mem.dataset.role = 'memory';
  right.appendChild(shard);
  right.appendChild(mem);
  h.appendChild(right);
  return { shard, mem };
};

/* HUD 数值刷新 + 闪光反馈 */
X.hudUpdate = function(flash){
  const h = document.getElementById('hud');
  if (!h || h.hidden) return;
  const shard = h.querySelector('[data-role="shard"] b');
  const mem = h.querySelector('[data-role="memory"] b');
  if (shard){
    shard.textContent = String(X.shardsFound()).padStart(2,'0') + '/' + X.shardsTotal();
    if (flash === 'shard') pulse(shard.parentElement);
  }
  if (mem){
    mem.textContent = String(X.memoryValue());
    if (flash === 'memory') pulse(mem.parentElement);
  }
  function pulse(n){ n.classList.remove('is-flash'); void n.offsetWidth; n.classList.add('is-flash'); }
};

X.nav = function(activeId){
  const n = document.getElementById('nav');
  n.innerHTML = '';
  n.hidden = false;
  const items = [
    { id:'s04', label:'探索', icon:'compass', go:'s04' },
    { id:'s18', label:'图鉴', icon:'book',    go:'s18' },
    { id:'tasks', label:'任务', icon:'list',  go:'tasks' },
    { id:'me', label:'我的', icon:'user',     go:'me' }
  ];
  items.forEach(it => {
    const b = el('button', {
      class: 'nav__item' + (it.id === activeId ? ' is-on' : ''),
      type: 'button',
      on: { click(){ X.sfx.tick(); if (it.go !== X.current()) X.go(it.go); } }
    }, node(X.ART.icon(it.icon)), el('span', { text: it.label }));
    n.appendChild(b);
  });
};

/* ------------------------------------------------------------
   4. 打字机 / 动效工具
   ------------------------------------------------------------ */
const typers = [];
X.on('screen', () => { typers.splice(0).forEach(t => clearInterval(t)); });
X.type = function(target, text, speed){
  return new Promise(resolve => {
    const sp = speed || 26;
    let i = 0;
    target.textContent = '';
    target.classList.add('caret');
    const t = setInterval(() => {
      i++;
      target.textContent = text.slice(0, i);
      if (i % 3 === 0) X.sfx.hover();
      if (i >= text.length){
        clearInterval(t);
        target.classList.remove('caret');
        resolve();
      }
    }, sp);
    typers.push(t);
  });
};

X.shake = function(node){
  if (!node) return;
  node.classList.remove('is-shake');
  void node.offsetWidth;
  node.classList.add('is-shake');
  X.later(() => node.classList.remove('is-shake'), 560);
};

/* 碎片飞入 HUD 的动画 */
X.flyShard = function(fromEl, artSvg){
  const target = document.querySelector('#hud [data-role="shard"]');
  if (!fromEl || !target) return Promise.resolve();
  const sr = fromEl.getBoundingClientRect();
  const tr = target.getBoundingClientRect();
  const stageRect = X.stage().getBoundingClientRect();
  const size = X.ux(8);
  const f = el('div', {
    class: 'flyer',
    html: artSvg,
    style: {
      left: (sr.left - stageRect.left + sr.width/2 - size/2) + 'px',
      top: (sr.top - stageRect.top + sr.height/2 - size/2) + 'px',
      width: size + 'px', height: size + 'px'
    }
  });
  X.stage().appendChild(f);
  const dx = (tr.left + tr.width/2) - (sr.left + sr.width/2);
  const dy = (tr.top + tr.height/2) - (sr.top + sr.height/2);
  f.animate(
    [ { transform:'translate(0,0) scale(.5)', opacity:0 },
      { transform:'translate(' + dx*0.28 + 'px,' + dy*0.42 + 'px) scale(1.25)', opacity:1, offset:.35 },
      { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.35)', opacity:0 } ],
    { duration: 1150, easing:'cubic-bezier(.3,.7,.3,1)' }
  );
  X.sfx.chime();
  return X.delay(1150).then(() => { f.remove(); X.hudUpdate('shard'); });
};

/* 白光一闪 */
X.flash = function(){
  const f = el('div', { class: 'flashlight is-on' });
  X.stage().appendChild(f);
  return X.delay(1700).then(() => f.remove());
};

/* ------------------------------------------------------------
   5. 通用拖拽
   ------------------------------------------------------------ */
function stageUnit(){ return X.unit(); }

X.drag = function(node, opts){
  const o = opts || {};
  let active = false, moved = false, sx = 0, sy = 0, dx = 0, dy = 0;

  function down(e){
    if (o.disabled && o.disabled()) return;
    active = true; moved = false;
    sx = e.clientX; sy = e.clientY; dx = dy = 0;
    node.classList.add('is-drag');
    if (node.setPointerCapture) node.setPointerCapture(e.pointerId);
    if (o.onStart) o.onStart(e);
    e.preventDefault();
  }
  function move(e){
    if (!active) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    if (o.onMove) o.onMove({ dxU: dx / stageUnit(), dyU: dy / stageUnit(), dx: dx, dy: dy, x: e.clientX, y: e.clientY, moved: moved });
  }
  function up(e){
    if (!active) return;
    active = false;
    node.classList.remove('is-drag');
    if (node.releasePointerCapture && e.pointerId != null){
      try { node.releasePointerCapture(e.pointerId); } catch(err){}
    }
    if (!moved && o.onClick) o.onClick(e);
    else if (o.onEnd) o.onEnd({ dxU: dx / stageUnit(), dyU: dy / stageUnit(), x: e.clientX, y: e.clientY, moved: moved });
  }
  node.addEventListener('pointerdown', down);
  node.addEventListener('pointermove', move);
  node.addEventListener('pointerup', up);
  node.addEventListener('pointercancel', up);
  return function destroy(){
    node.removeEventListener('pointerdown', down);
    node.removeEventListener('pointermove', move);
    node.removeEventListener('pointerup', up);
    node.removeEventListener('pointercancel', up);
  };
};

/* 判断坐标是否命中元素（用于拖到目标卡片） */
X.hitTest = function(nodes, x, y){
  for (let i = 0; i < nodes.length; i++){
    const r = nodes[i].getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return nodes[i];
  }
  // 近似命中（容差 5% 舞台宽）
  const pad = X.ux(4);
  for (let i = 0; i < nodes.length; i++){
    const r = nodes[i].getBoundingClientRect();
    if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return nodes[i];
  }
  return null;
};

/* ------------------------------------------------------------
   6. 拼图引擎
   cfg = {
     board, boardW, boardH,          // 板尺寸（u）
     pieces:[{id, slotId, svg, w, h, home:[x,y], slot:[x,y], rot, needRot}],
     rotate:bool, tolerance:u,       // 容差（u）
     onCreateSlot(slot, piece) -> node|null  // 自定义槽位元素
     onPlaced(piece, placedCount), onFail(piece, reason), onComplete(),
     onHover(piece, slot|null),
     feedbackFail(string)
   }
   ------------------------------------------------------------ */
X.puzzle = function(cfg){
  const board = cfg.board;
  const tol = cfg.tolerance || 10;
  const nodes = [];
  let placed = 0;
  let zTop = 10;   /* 最近被触碰的残片置于最上层，避免重叠时点错 */

  /* 槽位 */
  const slotMap = {};
  cfg.pieces.forEach(p => {
    let sn = null;
    if (cfg.onCreateSlot) sn = cfg.onCreateSlot(p);
    if (!sn){
      sn = X.el('div', { class: 'slot', style: {
        left: X.u(p.slot[0]), top: X.u(p.slot[1]),
        width: X.u(p.w), height: X.u(p.h)
      }});
    }
    board.appendChild(sn);
    slotMap[p.id] = sn;
    p._slotNode = sn;
  });

  /* 碎片 */
  cfg.pieces.forEach((p, idx) => {
    const n = X.el('div', {
      class: 'piece',
      style: {
        left: X.u(p.home[0]), top: X.u(p.home[1]),
        width: X.u(p.w), height: X.u(p.h)
      },
      html: p.svg,
      data: { id: p.id }
    });
    p._node = n;
    p._x = p.home[0]; p._y = p.home[1];
    p._rot = p.rot || 0;
    apply(p);
    board.appendChild(n);
    nodes.push(n);

    X.drag(n, {
      disabled(){ return !!p._locked; },
      onStart(){
        n.style.zIndex = 40;
        if (cfg.onHover) cfg.onHover(p, null);
      },
      onMove(m){
        p._x = p.home[0] + m.dxU;
        p._y = p.home[1] + m.dyU;
        apply(p);
        const s = nearest(p);
        Object.keys(slotMap).forEach(k => slotMap[k].classList.remove('is-hover'));
        if (s && !s._locked) s._slotNode.classList.add('is-hover');
        if (cfg.onHover) cfg.onHover(p, s);
      },
      onEnd(){
        const s = nearest(p);
        Object.keys(slotMap).forEach(k => slotMap[k].classList.remove('is-hover'));
        if (s && s.id === p.slotId && rotOk(p)){
          place(p, s);
        } else {
          fail(p, s);
        }
        if (!p._locked) n.style.zIndex = ++zTop;
      },
      onClick(){
        if (!cfg.rotate) return;
        p._rot = (p._rot + 90) % 360;
        apply(p, true);
        X.sfx.tick();
      }
    });
  });

  function apply(p, animate){
    const n = p._node;
    n.style.transition = animate ? 'transform .25s var(--ease-out)' : 'none';
    n.style.transform = 'translate(-50%,-50%) rotate(' + p._rot + 'deg)';
  }
  function rotOk(p){
    const need = p.needRot == null ? 0 : p.needRot;
    return (p._rot % 360) === (need % 360);
  }
  function nearest(p){
    /* 先判定自身槽位：只要落在自己的位置上，就允许吸附 */
    const own = cfg.pieces.filter(q => q.id === p.slotId)[0];
    if (own && !own._locked && Math.hypot(own.slot[0] - p._x, own.slot[1] - p._y) <= tol) return own;
    let best = null, bd = Infinity;
    cfg.pieces.forEach(q => {
      if (q._locked) return;
      const d = Math.hypot(q.slot[0] - p._x, q.slot[1] - p._y);
      if (d < bd){ bd = d; best = q; }
    });
    return (best && bd <= tol) ? best : null;
  }
  function place(p, slotPiece){
    p._locked = true;
    p._node.style.zIndex = '';
    p._x = slotPiece.slot[0]; p._y = slotPiece.slot[1];
    p._rot = p.needRot == null ? 0 : p.needRot;
    apply(p);
    p._node.classList.add('is-locked', 'is-snap', 'is-sweep');
    p._node.style.left = X.u(p._x);
    p._node.style.top = X.u(p._y);
    X.later(() => { p._node.classList.remove('is-snap', 'is-sweep'); }, 1200);
    slotPiece._slotNode.classList.add('is-filled');
    placed++;
    X.sfx.snap();
    if (cfg.onPlaced) cfg.onPlaced(p, placed);
    if (placed === cfg.pieces.length && cfg.onComplete) cfg.onComplete();
  }
  function fail(p, s){
    X.sfx.fail();
    if (s && s.id !== p.slotId){
      X.shake(p._node);
      if (cfg.onFail) cfg.onFail(p, 'wrong-slot');
    } else if (s && !rotOk(p)){
      X.shake(p._node);
      if (cfg.onFail) cfg.onFail(p, 'rot');
    } else {
      if (cfg.onFail) cfg.onFail(p, 'outside');
    }
    const n = p._node;
    n.style.transition = 'left .34s var(--ease-out), top .34s var(--ease-out), transform .34s var(--ease-out)';
    p._x = p.home[0]; p._y = p.home[1];
    n.style.left = X.u(p._x); n.style.top = X.u(p._y);
    X.later(() => { n.style.transition = ''; }, 380);
  }

  return {
    placed(){ return placed; },
    count(){ return cfg.pieces.length; },
    destroy(){ nodes.forEach(n => n.remove()); }
  };
};

})();

</script>
<script>
/* ============================================================
   《寻夏》 — screens-intro.js
   S01 启动页 / S02 开场动画 / S03 身份选择 / S04 主界面地图
   S05 · S12 · S15 章节引导
   ============================================================ */
(function(){
const X = window.X, D = X.DATA;

/* ------------------------------------------------------------
   S01 启动页
   ------------------------------------------------------------ */
X.registerScreen('s01', {
  className: 's--center',
  mount(root){
    root.classList.add('s01');
    const M = D.meta;

    root.appendChild(X.el('div', { class: 's01__bg', html: X.ART.sceneKickoff() }));
    root.appendChild(X.el('div', {
      class: 's01__glyphbg',
      style: {
        backgroundImage: 'url("data:image/svg+xml;utf8,' + encodeURIComponent(X.ART.glyphTile()) + '")',
        backgroundSize: 'calc(var(--u) * 12) calc(var(--u) * 12)'
      }
    }));
    root.appendChild(X.el('div', { class: 's01__glow' }));
    root.appendChild(X.el('div', { class: 's01__relic', html: X.ART.relic('relic01') }));

    const center = X.el('div', { class: 's01__center' },
      X.el('div', { class: 's01__logo' },
        X.el('div', { class: 't-display', text: '寻 夏' })),
      X.el('div', { class: 's01__logoSub stack stack--tight' },
        X.el('div', { class: 't-h3', text: '在千年遗址中' }),
        X.el('div', { class: 't-h3', text: '寻找消失的记忆' })),
      X.el('div', { class: 't-cap', style: { marginTop:'calc(var(--u) * 1.4)', letterSpacing:'.3em' }, text: M.tagline }),
      X.el('div', { class: 's01__press', text: '点击任意处进入' })
    );
    root.appendChild(center);

    root.appendChild(X.el('div', { class: 's01__meta t-archive' },
      X.el('div', { text: M.org }),
      X.el('div', { text: M.version })
    ));

    if (X.hasSave() && X.flag('started')){
      root.appendChild(X.el('div', { class: 's01__acts' },
        X.btn('继续寻夏', { variant:'primary', onClick(){ X.go('s04'); } }),
        X.btn('重新开始', { variant:'ghost', onClick(){
          X.reset(); X.toast('已重置全部进度'); X.go('s02');
        }})
      ));
    } else {
      root.appendChild(X.el('div', { class: 's01__hit', on: { click: enter } }));
    }

    function enter(){
      X.sfx.resume(); X.sfx.chime();
      X.go('s02');
    }
    /* 启动页任意点击也可进入（无存档时） */
    root.addEventListener('click', e => {
      if (X.hasSave() && X.flag('started')) return;
      if (e.target.closest('button')) return;
      enter();
    });
  }
});

/* ------------------------------------------------------------
   S02 开场动画
   ------------------------------------------------------------ */
X.registerScreen('s02', {
  className: 's--center',
  mount(root){
    root.classList.add('s02');
    const layers = X.ART.openingLayers();

    root.appendChild(X.el('div', { class: 's02__scene' },
      X.el('div', { class: 's02__far', html: layers.far }),
      X.el('div', { class: 's02__mid', html: layers.mid }),
      X.el('div', { class: 's02__near', html: layers.near })
    ));
    root.appendChild(X.el('div', { class: 's02__dust' },
      X.el('span'), X.el('span'), X.el('span')));
    root.appendChild(X.el('div', { class: 's02__letterbox' }));

    const lineDefs = [
      '千年以前，这里曾有一个王朝。',
      '他们留下文字、建筑与器物。',
      '而今天，我们只能从遗留下来的碎片中，寻找他们的故事。'
    ];
    const lines = X.el('div', { class: 's02__lines' });
    const lineNodes = lineDefs.map(t => X.el('div', { class: 's02__line', text: t }));
    const ask = X.el('div', { class: 's02__ask', text: '你愿意开始这场寻找吗？' });
    lineNodes.forEach(n => lines.appendChild(n));
    lines.appendChild(ask);
    root.appendChild(lines);

    const bar = X.el('div', { class: 'bar', style: { width:'100%' } }, X.el('div', { class: 'bar__fill' }));
    root.appendChild(X.el('div', { class: 's02__progress' }, bar));

    const acts = X.el('div', { class: 's02__acts' },
      X.btn('开始寻夏', { variant:'primary', pulse:true, onClick: start }));
    root.appendChild(acts);

    root.appendChild(X.el('div', { class: 's02__skip' },
      X.link('跳过 ›', () => { showAll(); })));

    const total = 12800;
    const fill = bar.firstElementChild;
    let elapsed = 0;
    const tick = X.loop(() => {
      elapsed += 100;
      fill.style.width = Math.min(100, elapsed / total * 100) + '%';
    }, 100);
    X.later(() => clearInterval(tick), total);

    X.later(() => lineNodes[0].classList.add('is-on'), 900);
    X.later(() => lineNodes[1].classList.add('is-on'), 4200);
    X.later(() => lineNodes[2].classList.add('is-on'), 7600);
    X.later(() => ask.classList.add('is-on'), 11000);
    X.later(() => acts.classList.add('is-on'), 12200);
    X.later(() => { if (X.current() === 's02') showAll(); }, total + 1400);

    function showAll(){
      lineNodes.forEach(n => n.classList.add('is-on'));
      ask.classList.add('is-on');
      acts.classList.add('is-on');
      fill.style.width = '100%';
    }
    function start(){
      X.state().opened = true;
      X.save();
      X.flash();
      X.delay(500).then(() => X.go('s03'));
    }
  }
});

   S03 身份选择
   ------------------------------------------------------------ */
X.registerScreen('s03', {
  className: 's--center',
  mount(root){
    root.classList.add('s03');
    let picked = X.state().identity || null;

    const cards = X.el('div', { class: 's03__cards' });
    const map = {};
    D.identities.forEach(idn => {
      const c = X.el('div', {
        class: 'idcard' + (picked === idn.id ? ' is-on' : ''),
        on: { click(){ pick(idn.id); } }
      },
        X.el('div', { class: 'idcard__icon', html: X.ART.icon(idn.icon) }),
        X.el('div', { class: 'idcard__name', text: idn.name }),

      );
      map[idn.id] = c;
      cards.appendChild(c);
    });

    const confirm = X.btn('确认身份', { variant:'primary', onClick(){
      if (!picked) return;
      X.state().identity = picked;
      X.state().started = true;
      X.save();
      X.sfx.chime();
      X.chapterFlash('序章 · 寻迹开始', '风沙中的遗迹').then(() => X.go('s04'));
    }});

    root.appendChild(X.el('div', { class: 's__content' },
      X.el('div', { class: 't-kicker', style: { textAlign:'center' }, text:'S03 · 你的身份' }),

      X.el('div', { style:{ marginTop:'calc(var(--u) * 1.8)' } }, confirm)
    ));

    function pick(id){
      picked = id;
      X.sfx.tick();
      Object.keys(map).forEach(k => map[k].classList.toggle('is-on', k === id));
      confirm.disabled = false;
    }
  }
});

   S04 主界面 · 西夏陵探索地图
   ------------------------------------------------------------ */
X.registerScreen('s04', {
  className: 's--center',
  mount(root){
    root.classList.add('s04');
    const s = X.state();
    const idn = D.identities.filter(i => i.id === s.identity)[0] || D.identities[0];
    const next = X.nextRegion();

    X.hud({
      chapter: '西夏陵探索地图',
      tag: X.progress() + '% · ' + (next ? next.name : '终章'),
      chapter2: true,
      onShard(){ X.go('s18'); }
    });
    X.nav('s04');

    /* 地图底板 + 路线 */
    const board = X.el('div', { class: 's04__map' });
    board.appendChild(X.el('div', { html: X.ART.mapBoard(), style:{ position:'absolute', inset:'0' } }));

    const pos = { gate:[50,6], stele:[24,29], garden:[76,29], vault:[50,54], door:[50,78] };
    const roadSvg = '<svg viewBox="0 0 112 62" preserveAspectRatio="none">' +
      X.ART.road({ d:'M56,6 C44,14 34,22 28,27' }) +
      X.ART.road({ d:'M28,30 C44,34 60,34 84,30' }) +
      X.ART.road({ d:'M84,25 C78,36 62,48 56,56' }) +
      X.ART.road({ d:'M56,60 L56,84', dash:true, stroke:'rgba(216,178,106,.35)' }) +
      '</svg>';
    board.appendChild(X.el('div', { class: 's04__roads', html: roadSvg, style:{ position:'absolute', inset:'0' } }));

    D.regions.forEach(r => {
      const p = pos[r.id];
      const unlocked = X.regionUnlocked(r);
      const done = X.regionDone(r);
      const isNext = next && next.id === r.id;
      const n = X.el('div', {
        class: 's04__node' + (unlocked ? '' : ' is-locked') + (done ? ' is-done' : '') + (isNext ? ' is-next' : ''),
        style: { left: p[0] + '%', top: p[1] + '%' },
        title: unlocked ? r.brief : r.locked,
        on: { click(){ tap(r, unlocked); } }
      },
        X.el('div', { class:'no', text: r.no }),
        X.el('div', { class:'disc', html: X.ART.icon(unlocked ? (r.id === 'gate' ? 'ruin' : r.id === 'stele' ? 'glyph' : r.id === 'garden' ? 'arch' : r.id === 'vault' ? 'book' : 'door') : 'lock') }),
        X.el('div', { class:'rowline' },
          X.el('div', { class:'name', text: unlocked ? r.name : '？？？' }),
          X.el('div', { class:'kind', text: unlocked ? r.kind : '未开放' }))
      );
      board.appendChild(n);
      /* 主线节点指示灯 */
      if (isNext) n.querySelector('.disc').classList.add('is-next');
    });

    root.appendChild(X.el('div', { class:'s__content', style:{ paddingTop:'calc(var(--u) * 9.6)' } },
      X.el('div', { class:'t-kicker t-center', style:{ marginBottom:'calc(var(--u) * 1.4)' }, text:'西夏陵 · 遗址探索' }),
      board
    ));

    /* 左上：身份徽记 */
    root.appendChild(X.el('div', { class:'s04__identity panel' },
      X.el('div', { style:{ width:'calc(var(--u) * 4.4)', height:'calc(var(--u) * 4.4)' }, html: X.ART.icon(idn.icon) }),
      X.el('div', { class:'col' },
        X.el('div', { class:'t-h3', text: idn.name }),
        X.el('div', { class:'t-archive', text: '寻迹身份 · ' + idn.perk }))
    ));

    /* 左下：主线引导 */
    const objective = X.el('div', { class:'s04__objective panel' },
      X.el('div', { class:'card__no', text:'当前主线 · ' + (next ? next.no + ' ' + next.name : '已完成') }),
      X.el('div', { class:'t-h3', style:{ margin:'calc(var(--u) * .8) 0' }, text: next ? next.desc : '记忆已重光' }),
      X.el('div', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.4)' }, text: next ? next.brief : '你可以随时回到任意区域，重新观察你的发现。' }),
      X.el('div', { style:{ marginTop:'calc(var(--u) * 1.6)' } },
        next && X.regionUnlocked(next)
          ? X.btn('进入 ' + next.name, { size:'sm', variant:'primary', onClick(){ X.go(next.screen, { region: next }); } })
          : X.btn('前往', { size:'sm', onClick(){
              const prev = D.regions[D.regions.indexOf(next) - 1] || D.regions[0];
              X.toast('先完成「' + prev.name + '」的探索。');
            }}))
    );
    root.appendChild(objective);

    /* 右下：收集进度 */
    const found = X.shardsFound(), totalS = X.shardsTotal();
    root.appendChild(X.el('div', { class:'s04__progressMini panel' },
      X.el('div', { class:'panel__hd' },
        X.el('b', { text:'收集进度' }),
        X.el('span', { class:'t-archive', text: found + ' / ' + totalS })),
      X.el('div', { class:'bar' }, X.el('div', { class:'bar__fill', style:{ width:(found/totalS*100) + '%' } })),
      X.el('div', { class:'row', style:{ marginTop:'calc(var(--u) * 1.4)', justifyContent:'space-between' } },
        X.el('span', { class:'t-cap', text:'探索进度 ' + X.progress() + '%' }),
        X.link('打开图鉴', () => X.go('s18')))
    ));

    function tap(r, unlocked){
      if (!unlocked){
        X.sfx.fail();
        X.toast(r.locked || D.tips.locked, { type:'warn' });
        return;
      }
      X.sfx.tick();
      X.go(r.screen, { region: r });
    }
  }
});

</script>
<script>
/* ============================================================
   《寻夏》 — screens-explore.js
   S06 自由探索 / S07 遗物观察 / S08 文物判断
   S09 残片修复 / S10 遗珍档案 / S11 图鉴首次解锁
   ============================================================ */
(function(){
const X = window.X, D = X.DATA;

/* ------------------------------------------------------------
   S06 自由探索 · 寻找遗物
   ------------------------------------------------------------ */
X.registerScreen('s06', {
  mount(root){
    root.classList.add('s06');
    const relic = X.relic('relic01');
    let checked = 0, firstJunk = true;

    X.hud({ back:true, backTo:'s04', chapter:'第一章 · 陵门', tag:'S06 · 寻找遗物',
            onShard(){ if (relic.found) X.go('s07'); } });

    root.appendChild(X.el('div', { class:'s06__scene', html: X.ART.sceneGate() }));

    const props = X.el('div', { class:'s06__props' });
    root.appendChild(props);

    const count = X.el('span', { class:'s06__count', text:'已检查 00 / ' + D.gateScene.props.length });
    const barFill = X.el('div', { class:'bar__fill' });
    root.appendChild(X.el('div', { class:'s06__hudline' },
      X.el('span', { class:'t-archive', text:'点击地表物件，寻找可辨认的遗物' }),
      X.el('div', { class:'s06__bar bar' }, barFill),
      count
    ));

    /* 提示：一件一件看过去 */
    const hint = X.el('div', {
      class:'panel', style:{
        position:'absolute', left:'calc(var(--u) * 3.2)', top:'calc(var(--u) * 10.5)',
        width:'calc(var(--u) * 30)', zIndex:8, pointerEvents:'none'
      }
    },
      X.el('div', { class:'card__no', text:'探索提示' }),
      X.el('div', { class:'t-body', style:{ marginTop:'calc(var(--u) * .8)' },
        text:'地表的碎片很多，但只有一件带着规律性的纹样。' }),
      X.el('div', { class:'hint-line', style:{ marginTop:'calc(var(--u) * 1.2)' }, text:'寻找 · 观察 · 判断' }));
    root.appendChild(hint);

    if (relic.found) hint.innerHTML = '';

    D.gateScene.props.forEach(p => {
      const n = X.el('div', {
        class: 'prop', style: {
          left: p.x + '%', top: p.y + '%',
          width: X.u(p.s), height: X.u(p.s)
        },
        html: X.ART.prop(p.k),
        title: '调查',
        on: { click(){ tap(p, n); } }
      });
      if (p.kind === 'relic' && relic.found) n.classList.add('is-done');
      props.appendChild(n);
    });

    /* 若已找到，给出直达入口 */
    if (relic.found && !relic.archived){
      root.appendChild(X.el('div', {
        class:'panel', style:{
          position:'absolute', right:'calc(var(--u) * 3.2)', top:'calc(var(--u) * 10.5)',
          width:'calc(var(--u) * 30)', zIndex:8
        }
      },
        X.el('div', { class:'card__no', text:'已获得 · 遗珍碎片 ①' }),
        X.el('div', { class:'t-body', style:{ margin:'calc(var(--u) * .8) 0' }, text:'这块碎片还在等你观察。' }),
        X.btn('进入观察台', { size:'sm', variant:'primary', onClick(){ X.go('s07'); } })
      ));
    }

    function bump(){
      checked = Math.min(D.gateScene.props.length, checked + 1);
      count.textContent = '已检查 ' + String(checked).padStart(2,'0') + ' / ' + D.gateScene.props.length;
      barFill.style.width = (checked / D.gateScene.props.length * 100) + '%';
    }

    function tap(p, node){
      X.state().counters.clicks++;
      if (node.classList.contains('is-done')) return;

      if (p.kind === 'junk'){
        X.sfx.fail();
        X.shake(node);
        bump();
        node.classList.add('is-done');
        if (firstJunk){
          firstJunk = false;
          X.modal({
            title: '尚未发现',
            body: '<p>' + p.text + '</p><p class="t-cap" style="margin-top:1em">并不是每一块石头都会说话。继续寻找，注意表面是否有规律性的痕迹。</p>',
            actions: [{ label:'继续寻找', onClick(close){ close(); } }]
          });
        } else {
          X.toast(p.text);
        }
        return;
      }

      if (p.kind === 'clue'){
        X.sfx.ok();
        bump();
        node.classList.add('is-done');
        X.hudUpdate('memory');
        X.modal({
          title: '获得观察线索',
          body: '<p>' + p.text + '</p>',
          actions: [{ label:'记下来', variant:'primary', onClick(close){ close(); } }]
        });
        return;
      }

      /* 正确的文物 */
      X.sfx.crack();
      bump();
      node.classList.add('is-done');
      relic.found = true;
      X.save();

      const ring = X.el('div', {
        class:'halo',
        style:{ left:(p.x + '%'), top:(p.y + '%'), width:X.u(p.s * 1.6), height:X.u(p.s * 1.6),
                transform:'translate(-50%,-50%) scale(1)', marginLeft:'0', marginTop:'0' }
      });
      ring.style.animation = 'ringExpand 1.2s var(--ease-out) forwards';
      props.appendChild(ring);
      X.later(() => ring.remove(), 1400);

      X.flyShard(node, X.ART.relic('relic01')).then(() => {
        showFound(node);
      });
    }

    function showFound(node){
      const F = D.relics.relic01;
      const overlay = X.el('div', { class:'found' },
        X.el('div', { class:'found__inner' },
          X.el('div', { class:'found__title', text:'发现遗物' }),
          X.el('div', {
            class:'found__card panel', style:{ width:'calc(var(--u) * 46)', textAlign:'center' }
          },
            X.el('div', {
              style:{ width:'calc(var(--u) * 16)', height:'calc(var(--u) * 16)', margin:'0 auto' },
              html: X.ART.relic('relic01')
            }),
            X.el('div', { class:'t-h3', style:{ marginTop:'calc(var(--u) * 1)' }, text:'获得：遗珍碎片 ①' }),
            X.el('div', { class:'card__no', style:{ marginTop:'calc(var(--u) * .6)' }, text:'遗珍 #' + F.no + ' · ' + F.category })
          ),
          X.el('div', { class:'t-quote t-center', style:{ maxWidth:'calc(var(--u) * 54)' },
            text:'“有些东西看起来毫不起眼，却可能是历史留下的证据。”' }),
          X.btn('观察遗物', { variant:'primary', pulse:true, onClick(){ X.go('s07'); } })
        )
      );
      root.appendChild(overlay);

X.registerScreen('s07', {
  className: 's--center',
  mount(root){
    root.classList.add('s07');
    const relic = X.relic('relic01');
    const F = D.relics.relic01;
    let rotY = 0, zoom = 1, rotStart = 0;

    X.hud({ back:true, backTo:'s06', chapter:'第一章 · 陵门', tag:'S07 · 遗物观察' });

    const artifact = X.el('div', { class:'s07__artifact', html: X.ART.relic('relic01') });
    const viewer = X.el('div', { class:'s07__viewer board' },
      X.el('div', { class:'board__grid' }),
      X.el('div', { class:'s07__crosshair' }),
      X.el('div', { class:'s07__stage' }, artifact),
      X.el('div', {
        class:'t-archive', style:{ position:'absolute', left:'calc(var(--u) * 2)', top:'calc(var(--u) * 1.6)' },
        text:'观察台 · 遗珍 #' + F.no
      }),
      X.el('div', {
        class:'t-archive', style:{ position:'absolute', right:'calc(var(--u) * 2)', bottom:'calc(var(--u) * 1.6)' },
        text:'左右拖动可旋转 · ± 可缩放'
      })
    );

    /* 交互：拖动旋转 */
    X.drag(viewer, {
      onStart(){ rotStart = rotY; },
      onMove(m){ rotY = rotStart + m.dx * 0.85; apply(); },
      onClick(){}
    });
    viewer.style.touchAction = 'none';
    viewer.style.cursor = 'grab';

    function apply(){
      artifact.style.transform = 'rotateY(' + rotY + 'deg) scale(' + zoom + ')';
      zoomBarFill.style.width = ((zoom - 0.6) / 1.8 * 100) + '%';
    }

    const zoomBarFill = X.el('div', { class:'bar__fill' });
    const zoomOut = X.el('div', { class:'zoom-btn', text:'−', on:{ click(){ zoom = Math.max(.6, zoom - .2); apply(); X.sfx.tick(); } } });
    const zoomIn  = X.el('div', { class:'zoom-btn', text:'＋', on:{ click(){ zoom = Math.min(2.4, zoom + .2); apply(); X.sfx.tick(); } } });

    /* 三个观察维度 */
    const readout = X.el('div', { class:'s07__readout t-body' },
      X.el('div', { class:'t-cap', text:'选择一种观察方式，获取线索。' }));
    const clueBtns = {};
    const side = X.el('div', { class:'s07__side' });
    ['pattern','material','form'].forEach((k, i) => {
      const label = { pattern:'纹样', material:'材质', form:'形制' }[k];
      const b = X.el('button', {
        class:'clue-btn' + (relic.clues[k] ? ' is-done' : ''),
        type:'button',
        on:{ click(){ reveal(k); } }
      },
        X.el('span', { text:'【' + label + '】' }),
        X.el('span', { class:'clue-btn__state', text: relic.clues[k] ? '已记录' : '未观察' })
      );
      clueBtns[k] = b;
      side.appendChild(b);
    });
    side.appendChild(readout);
    side.appendChild(X.el('div', { class:'s07__zoo' }, zoomOut, X.el('div', { class:'bar' }, zoomBarFill), zoomIn));

    const submit = X.btn('提交判断', { variant:'primary', onClick(){ X.go('s08'); } });
    submit.disabled = Object.keys(relic.clues).length < 3;
    side.appendChild(X.el('div', { style:{ marginTop:'calc(var(--u) * .6)' } }, submit));

    root.appendChild(X.el('div', { class:'s__content' },
      X.el('div', { class:'s07__wrap' }, viewer, side)
    ));

    apply();

    function reveal(k){
      if (relic.clues[k]){ 
        typeOut(k); return;
      }
      relic.clues[k] = true;
      X.save();
      X.sfx.ok();
      clueBtns[k].classList.add('is-done');
      clueBtns[k].querySelector('.clue-btn__state').textContent = '已记录';
      X.hudUpdate('memory');
      typeOut(k);
      if (Object.keys(relic.clues).length >= 3){
        submit.disabled = false;
        submit.classList.add('is-pulse');
        X.toast('三个维度都已观察，可以提交判断了。', { type:'gold' });
      }
    }
    function typeOut(k){
      const label = { pattern:'纹样', material:'材质', form:'形制' }[k];
      readout.innerHTML = '<b>' + label + '：</b>';
      const span = X.el('span');
      readout.appendChild(span);
      X.type(span, D.relics.relic01.clues[k], 22);
    }

    /* 进入时若已观察过，显示最后一条 */
    const keys = Object.keys(relic.clues);
    if (keys.length) typeOut(keys[keys.length - 1]);
  }
});

X.registerScreen('s09', {
  className: 's--center',
  mount(root){
    root.classList.add('s09');

    const F = D.relics.relic01;
    /* 修复台坐标：文物 100×100 帧中，有效区域取自 y=30 起、高 64 的部分 */
    const BW = 72, BH = 34, S = 26, FRY = 30, K = S / 100;
    const tray = [ 6, (BH - 64 * K) / 2 ];

    X.hud({ back:true, backTo:'s08', chapter:'第一章 · 陵门', tag:'S09 · 残片修复' });

    const board = X.el('div', { class:'puzzle__board', style:{ width:X.u(BW), height:X.u(BH) } });
    board.appendChild(X.el('div', { class:'board__grid' }));

    /* 虚线文物轮廓 */
    board.appendChild(X.el('div', {
      class:'outline is-filled',
      style:{ left:X.u(tray[0] + S/2), top:X.u(tray[1] + 64 * K / 2),
              width:X.u(S), height:X.u(64 * K), border:'none' },
      html: X.ART.svg('0 30 100 64', X.ART.relicOutlineInner(), 'preserveAspectRatio="xMidYMid meet"')
    }));

    const countEl = X.el('span', { class:'puzzle__count', text:'残片 0 / 5' });
    const barFill = X.el('div', { class:'bar__fill' });
    const note = X.el('div', { class:'puzzle__note', text: F.repairNote });
    const actRow = X.el('div', { class:'puzzle__acts' });

    root.appendChild(X.el('div', { class:'s__content', style:{ flexDirection:'row', alignItems:'center', gap:'calc(var(--u) * 3)', justifyContent:'center' } },
      board,
      X.el('div', { class:'col', style:{ width:'calc(var(--u) * 23)', gap:'calc(var(--u) * 1.4)' } },
        X.el('div', { class:'t-archive', text:'S09 · 修复台' }),
        X.el('div', { class:'t-h3', text:'把残片放回轮廓' }),
        X.el('div', { class:'puzzle__bar' }, X.el('div', { class:'bar' }, barFill), countEl),
        note,
        X.el('div', { class:'puzzle__note t-cap', text:'拖动残片放回轮廓中 · 点击残片可旋转 90°' }),
        actRow)
    ));

    const pieces = X.ART.relicPieces();
    const homes = [ [45,9], [56,9], [67,9], [56,25], [67,25] ];
    const cfgPieces = pieces.map((p, i) => {
      const w = p.box[2] * K, h = p.box[3] * K;
      return {
        id:'p' + i, slotId:'p' + i,
        svg: X.ART.relicPiece('relic01', p),
        w, h,
        home: homes[i],
        slot: [ tray[0] + p.center[0] * K, tray[1] + (p.center[1] - FRY) * K ],
        rot: (i === 1 ? 90 : i === 3 ? 270 : 0),
        needRot: 0
      };
    });

    const puzzle = X.puzzle({
      board, pieces: cfgPieces, rotate:true, tolerance:5.4,
      onCreateSlot(p){
        return X.el('div', { class:'slot', style:{
          left:X.u(p.slot[0]), top:X.u(p.slot[1]),
          width:X.u(p.w), height:X.u(p.h),
          border:'none', background:'none'
        }});
      },
      onPlaced(p, n){
        countEl.textContent = '残片 ' + n + ' / 5';
        barFill.style.width = (n / 5 * 100) + '%';
        note.textContent = ['纹理开始衔接。','裂缝正在合拢。','图案逐渐连续。','只剩最后一块。'][Math.min(3, n - 1)] || '';
      },
      onFail(p, reason){
        if (reason === 'rot'){
          note.textContent = '纹理似乎无法衔接。';
          X.toast('纹理似乎无法衔接。试试旋转这块残片。', { type:'warn' });
        } else if (reason === 'wrong-slot'){
          note.textContent = '这个位置不属于它。';
          X.toast('这个位置不属于它。', { type:'warn' });
        } else {
          note.textContent = '再靠近一些，把残片放回文物的轮廓里。';
        }
      },
      onComplete(){
        relic.restored = true;
        X.save();
        note.textContent = '修复完成';
        X.flash();
        X.sfx.chime();
        board.animate(
          [ { filter:'brightness(1)' }, { filter:'brightness(1.5)' }, { filter:'brightness(1)' } ],
          { duration: 1400, easing:'ease-out' }
        );
        X.later(() => {
          actRow.appendChild(X.btn('修复完成', { variant:'primary', pulse:true, onClick(){ X.go('s10'); } }));
        }, 1500);
        X.hudUpdate('memory');
      }
    });
    if (relic.restored){
      countEl.textContent = '已修复';
      barFill.style.width = '100%';
      note.textContent = '这件器物已经拼合完成。';
      actRow.appendChild(X.btn('查看档案', { variant:'primary', onClick(){ X.go('s10'); } }));
    }
  }
});
