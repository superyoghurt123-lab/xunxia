<script>
/* ============================================================
   《寻夏》 — screens-glyph.js
   S13 辨认文字（拖拽匹配）/ S14 文字拼合（笔画修复）
   ============================================================ */
(function(){
const X = window.X, D = X.DATA;

/* ------------------------------------------------------------
   S13 辨认文字
   ------------------------------------------------------------ */
X.registerScreen('s13', {
  className: 's--center',
  mount(root){
    root.classList.add('s13');
    const s = X.state();
    const order = ['g1','g2','g3'];
    const meaningOrder = ['g2','g3','g1'];   // 打乱后的释义顺序
    let solved = 0;

    X.hud({ back:true, backTo:'s12', chapter:'第二章 · 碑亭', tag:'S13 · 辨认文字' });

    const leftCol = X.el('div', { class:'s13__col' });
    const rightCol = X.el('div', { class:'s13__col' });
    const cardMap = {};
    const meaningMap = {};

    /* 左：西夏文字卡片 */
    order.forEach(gid => {
      const g = D.glyphs[gid];
      const card = X.el('div', {
        class:'glyph-card' + (s.glyphs[gid] && s.glyphs[gid].matched ? ' is-locked' : ''),
        data:{ gid },
        html: X.ART.glyphSvg(gid)
      });
      cardMap[gid] = card;
      leftCol.appendChild(card);
      if (!(s.glyphs[gid] && s.glyphs[gid].matched)) bindDrag(card, gid);
    });

    /* 右：释义 */
    meaningOrder.forEach(gid => {
      const g = D.glyphs[gid];
      const done = s.glyphs[gid] && s.glyphs[gid].matched;
      const m = X.el('div', { class:'meaning' + (done ? ' is-done' : ''), data:{ gid } },
        X.el('div', { class:'meaning__glyph', html: X.ART.glyphSvg(gid) }),
        X.el('div', { class:'col', style:{ gap:'calc(var(--u) * .3)' } },
          X.el('div', { class:'meaning__text', text:'「' + g.meaning + '」' }),
          X.el('div', { class:'meaning__note', text: g.note }))
      );
      if (done) m.querySelector('.meaning__glyph').style.opacity = 1;
      meaningMap[gid] = m;
      rightCol.appendChild(m);
    });

    const note = X.el('div', { class:'t-quote t-center', style:{ maxWidth:'calc(var(--u) * 62)' },
      text:'把左边的文字，拖到右边它对应的含义上。' });
    const actRow = X.el('div', { class:'puzzle__acts' });

    root.appendChild(X.el('div', { class:'s__content stack', style:{ gap:'calc(var(--u) * 2.4)' } },
      X.el('div', { class:'t-kicker', text:'S13 · 辨认文字' }),
      X.el('div', { class:'s13__grid' }, leftCol, rightCol),
      note,
      actRow
    ));

    /* 恢复已完成的进度 */
    order.forEach(gid => {
      if (s.glyphs[gid] && s.glyphs[gid].matched){
        solved++;
        meaningMap[gid].classList.add('is-done');
        meaningMap[gid].querySelector('.meaning__glyph').style.opacity = 1;
        cardMap[gid].style.visibility = 'hidden';
      }
    });
    if (solved >= 3) finish(true);

    function bindDrag(card, gid){
      X.drag(card, {
        onStart(){ card.style.zIndex = 30; card.style.transition = 'none'; },
        onMove(m){
          card.style.transform = 'translate(calc(var(--u) * ' + m.dxU + '), calc(var(--u) * ' + m.dyU + '))';
          const hit = X.hitTest(Object.keys(meaningMap).map(k => meaningMap[k]), m.x, m.y);
          Object.keys(meaningMap).forEach(k => meaningMap[k].classList.toggle('is-hover', meaningMap[k] === hit));
        },
        onEnd(m){
          card.style.transition = 'transform .3s var(--ease-out)';
          const hit = X.hitTest(Object.keys(meaningMap).map(k => meaningMap[k]), m.x, m.y);
          Object.keys(meaningMap).forEach(k => meaningMap[k].classList.remove('is-hover'));
          card.style.zIndex = '';
          if (hit && hit.dataset.gid === gid) correct(gid, card, hit);
          else wrong(hit, card);
        }
      });
    }

    function correct(gid, card, meaning){
      X.sfx.ok();
      X.state().glyphs[gid] = { matched:true };
      X.save();
      solved++;
      meaning.classList.add('is-done');
      meaning.querySelector('.meaning__glyph').style.opacity = 1;
      card.style.transform = 'none';
      card.style.visibility = 'hidden';
      X.hudUpdate('memory');
      note.innerHTML = '';
      note.appendChild(X.el('div', { class:'t-h3 t-gold', text:'你读懂了一个字。' }));
      const p = X.el('div', { class:'t-quote', style:{ marginTop:'calc(var(--u) * .6)' } });
      note.appendChild(p);
      X.type(p, '当文字再次被理解，沉睡的历史便多了一种声音。', 24);
      if (solved >= 3) finish(false);
    }

    function wrong(hit, card){
      X.sfx.fail();
      X.shake(card);
      card.style.transform = 'none';
      if (hit){
        hit.classList.add('is-wrong');
        X.later(() => hit.classList.remove('is-wrong'), 1200);
      }
      X.toast(D.tips.glyphFail, { type:'warn' });
      note.textContent = '别急着判断。看看它的结构与笔画。';
    }

    function finish(silent){
      note.innerHTML = '';
      const wrap = X.el('div', { class:'stack stack--tight' },
        X.el('div', { class:'t-h3 t-gold', text:'三组文字都被辨认出来了。' }),
        X.el('div', { class:'t-quote', text:'你已经能读出石碑上的一小段话了。' }));
      note.appendChild(wrap);
      actRow.innerHTML = '';
      actRow.appendChild(X.btn('继续 · 修复缺失的文字', { variant:'primary', pulse:true, onClick(){
        X.state().relics.relic02 = X.relic('relic02');
        X.relic('relic02').found = true;
        X.relic('relic02').archived = true;
        X.save();
        X.toast('获得：刻纹石残块（遗珍 #002）', { type:'gold' });
        X.go('s14');
      }}));
      if (!silent) X.sfx.chime();
    }
  }
});

/* ------------------------------------------------------------
   S14 文字拼合 · 缺失的笔画
   ------------------------------------------------------------ */
X.registerScreen('s14', {
  className: 's--center',
  mount(root){
    root.classList.add('s14');
    const R = D.glyphRepair;
    const gid = R.id;
    const g = D.glyphs[gid];
    const done = X.state().glyphRepairDone;

    /* 字形映射：100×100 帧 → 30×30 u，位于画板左侧 */
    const BW = 62, BH = 30, O = [3, 0], K = 0.3, PAD = 10;

    X.hud({ back:true, backTo:'s13', chapter:'第二章 · 碑亭', tag:'S14 · 文字拼合' });

    const board = X.el('div', { class:'puzzle__board', style:{ width:X.u(BW), height:X.u(BH) } });
    board.appendChild(X.el('div', { class:'board__grid' }));

    /* 残缺的字（保留基础笔画） */
    board.appendChild(X.el('div', {
      style:{ position:'absolute', left:X.u(O[0]), top:X.u(O[1]), width:X.u(30), height:X.u(30) },
      html: X.ART.glyphSvg(gid, { omit:g.missing, color:'rgba(230,207,164,.85)' })
    }));
    board.appendChild(X.el('div', {
      class:'t-archive', style:{ position:'absolute', left:X.u(O[0]), top:X.u(BH - 3.4), color:'rgba(232,221,197,.4)' },
      text:'碑刻 · 残存部分'
    }));

    const countEl = X.el('span', { class:'puzzle__count', text:'笔画 0 / ' + g.missing.length });
    const barFill = X.el('div', { class:'bar__fill' });
    const note = X.el('div', { class:'puzzle__note', text:R.text });
    const actRow = X.el('div', { class:'puzzle__acts' });

    root.appendChild(X.el('div', { class:'s__content', style:{
      flexDirection:'row', alignItems:'center', gap:'calc(var(--u) * 3)', justifyContent:'center'
    } },
      board,
      X.el('div', { class:'col', style:{ width:'calc(var(--u) * 26)', gap:'calc(var(--u) * 1.4)' } },
        X.el('div', { class:'t-archive', text:'S14 · 缺失的文字' }),
        X.el('div', { class:'t-h3', text:'补齐笔画' }),
        X.el('div', { class:'puzzle__bar' }, X.el('div', { class:'bar' }, barFill), countEl),
        note,
        X.el('div', { class:'puzzle__note t-cap', text:'拖动笔画碎片，放回石碑上的空缺处。' }),
        actRow)
    ));

    const homes = { s2:[46,7], s3:[42,19], s4:[54,19] };
    const pieces = g.missing.map(sid => {
      const st = g.strokes.filter(x => x.id === sid)[0];
      const b = st.box;
      const pb = [ b[0] - PAD, b[1] - PAD, b[2] + PAD*2, b[3] + PAD*2 ];
      return {
        id:sid, slotId:sid,
        svg: X.ART.svg(pb.join(' '), '<path d="' + st.d + '" fill="none" stroke="#e6cfa4" stroke-width="3.4" stroke-linecap="square"/>',
              'preserveAspectRatio="xMidYMid meet"'),
        w: pb[2] * K, h: pb[3] * K,
        home: homes[sid],
        slot: [ O[0] + (pb[0] + pb[2]/2) * K, O[1] + (pb[1] + pb[3]/2) * K ],
        rot:0, needRot:0
      };
    });

    const puzzle = X.puzzle({
      board, pieces, tolerance:5,
      onCreateSlot(p){
        const sid = p.id;
        const st = g.strokes.filter(x => x.id === sid)[0];
        const b = st.box;
        return X.el('div', { class:'slot', style:{
          left:X.u(O[0] + (b[0] + b[2]/2) * K), top:X.u(O[1] + (b[1] + b[3]/2) * K),
          width:X.u(Math.max(1.6, b[2] * K)), height:X.u(Math.max(1.2, b[3] * K)),
          borderWidth:'1px', borderStyle:'dashed'
        }});
      },
      onPlaced(p, n){
        countEl.textContent = '笔画 ' + n + ' / ' + g.missing.length;
        barFill.style.width = (n / g.missing.length * 100) + '%';
        note.textContent = n < g.missing.length ? '笔画正在回到它原来的位置。' : '文字恢复成功。';
      },
      onFail(p, reason){
        X.toast(D.tips.strokeFail, { type:'warn' });
        note.textContent = '这一笔接不上，换一个位置试试。';
      },
      onComplete(){
        X.state().glyphRepairDone = true;
        X.save();
        X.sfx.chime();
        X.flash();
        note.textContent = '文字恢复成功';
        X.hudUpdate('shard');
        X.later(() => {
          actRow.appendChild(X.btn('获得 · 西夏文字碎片 ×1', { variant:'primary', pulse:true, onClick(){
            X.toast('获得：西夏文字碎片 ×1', { type:'gold' });
            X.go('s15');
          }}));
        }, 1500);
      }
    });

    if (done){
      countEl.textContent = '已完成';
      barFill.style.width = '100%';
      note.textContent = '这组文字已经完整复原。';
      actRow.appendChild(X.btn('前往第三章 · 陵园', { variant:'primary', onClick(){ X.go('s15'); } }));
    }
  }
});

})();

</script>
<script>
/* ============================================================
   《寻夏》 — screens-site.js
   S16 建筑观察 / S17 陵园拼图 / S18 遗珍库 / S19 线索关联
   ============================================================ */
(function(){
const X = window.X, D = X.DATA;

/* ------------------------------------------------------------
   S16 建筑观察 · 寻找空间线索
   ------------------------------------------------------------ */
X.registerScreen('s16', {
  mount(root){
    root.classList.add('s16');
    const s = X.state();
    const clues = D.gardenScene.clues;
    let found = clues.filter(c => s.siteClues[c.id]).length;

    X.hud({ back:true, backTo:'s15', chapter:'第三章 · 陵园', tag:'S16 · 建筑观察' });

    root.appendChild(X.el('div', { class:'s16__scene', html: X.ART.sceneGarden('ruin') }));

    const barFill = X.el('div', { class:'bar__fill' });
    const count = X.el('span', { class:'puzzle__count', text: found + ' / 3' });
    root.appendChild(X.el('div', { class:'s16__hud' },
      X.el('div', { class:'t-h3', text:'寻找 3 处空间线索' }),
      X.el('div', { class:'t-cap', style:{ marginTop:'calc(var(--u) * .4)' },
        text:'“这里不是一座孤立的墓。观察它的空间关系。”' }),
      X.el('div', { class:'row', style:{ marginTop:'calc(var(--u) * 1)', width:'calc(var(--u) * 40)' } },
        X.el('div', { class:'bar' }, barFill), count)
    ));

    const hotspots = {};
    clues.forEach(c => {
      const done = !!s.siteClues[c.id];
      const h = X.el('div', {
        class:'hotspot' + (done ? ' is-done' : ''),
        style:{ left:c.x + '%', top:c.y + '%' },
        on:{ click(){ open(c); } }
      },
        X.el('div', { class:'hotspot__dot' }),
        X.el('div', { class:'hotspot__label', text: done ? c.name + ' · 已记录' : c.name })
      );
      hotspots[c.id] = h;
      root.appendChild(h);
    });

    const sidePanel = X.el('div', { class:'s16__panel panel' },
      X.el('div', { class:'card__no', text:'空间线索记录' }),
      X.el('div', { class:'col', style:{ gap:'calc(var(--u) * .8)', marginTop:'calc(var(--u) * 1)' } },
        clues.map(c => X.el('div', { class:'row', style:{ gap:'calc(var(--u) * 1)' } },
          X.el('span', { class:'code', style:{ width:'calc(var(--u) * 4)' }, text:'#' + c.no }),
          X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' },
            text: c.name + (s.siteClues[c.id] ? ' · 已记录' : ' · 待观察') })))),
      X.el('div', { style:{ marginTop:'calc(var(--u) * 1.6)' } },
        X.btn('进入陵园拼图', { size:'sm', variant:'primary', onClick(){ X.go('s17'); } }))
    );
    root.appendChild(sidePanel);

    function open(c){
      const already = !!X.state().siteClues[c.id];
      const zoom = X.el('div', { class:'s16__zoom' },
        X.el('div', { class:'s16__zoomBox' },
          X.el('div', { class:'s16__zoomImg', html: X.ART.zoomView(c.art) }),
          X.el('div', { class:'panel', style:{ marginTop:'calc(var(--u) * 2)' } },
            X.el('div', { class:'card__no', text: c.title }),
            X.el('div', { class:'t-body', style:{ margin:'calc(var(--u) * 1) 0' }, text: c.text }),
            X.el('div', { class:'row', style:{ justifyContent:'flex-end' } },
              already
                ? X.btn('返回', { onClick(){ zoom.remove(); } })
                : X.btn('记录这条线索', { variant:'primary', onClick(){
                    X.state().siteClues[c.id] = true;
                    X.save();
                    found++;
                    barFill.style.width = (found / 3 * 100) + '%';
                    count.textContent = found + ' / 3';
                    hotspots[c.id].classList.add('is-done');
                    hotspots[c.id].querySelector('.hotspot__label').textContent = c.name + ' · 已记录';
                    sidePanel.remove();
                    root.appendChild(buildPanel());
                    X.hudUpdate('memory');
                    X.sfx.ok();
                    zoom.remove();
                    if (found >= 3){
                      X.toast('三处空间线索已记录。', { type:'gold' });
                      X.later(() => X.go('s17'), 900);
                    }
                  }}))
          )
        )
      );
      root.appendChild(zoom);
      X.sfx.tick();
    }

    function buildPanel(){
      return X.el('div', { class:'s16__panel panel' },
        X.el('div', { class:'card__no', text:'空间线索记录' }),
        X.el('div', { class:'col', style:{ gap:'calc(var(--u) * .8)', marginTop:'calc(var(--u) * 1)' } },
          clues.map(c => X.el('div', { class:'row', style:{ gap:'calc(var(--u) * 1)' } },
            X.el('span', { class:'code', style:{ width:'calc(var(--u) * 4)' }, text:'#' + c.no }),
            X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' },
              text: c.name + (X.state().siteClues[c.id] ? ' · 已记录' : ' · 待观察') })))),
        X.el('div', { style:{ marginTop:'calc(var(--u) * 1.6)' } },
          X.btn('进入陵园拼图', { size:'sm', variant:'primary', onClick(){ X.go('s17'); } }))
      );
    }

    barFill.style.width = (found / 3 * 100) + '%';
    if (found >= 3) X.toast('三处空间线索都已记录。', { type:'gold' });
  }
});

/* ------------------------------------------------------------
   S17 陵园拼图 · 重建陵园
   ------------------------------------------------------------ */
X.registerScreen('s17', {
  className: 's--center',
  mount(root){
    root.classList.add('s17');
    const P = D.plan;
    const done = X.state().planDone;

    const BW = 84, BH = 32, K = BH / 90;      // 平面图坐标系 160×90 → 板面
    const OX = 1;                              // 平面图左偏移

    X.hud({ back:true, backTo:'s16', chapter:'第三章 · 陵园', tag:'S17 · 重建陵园' });

    const board = X.el('div', { class:'puzzle__board', style:{ width:X.u(BW), height:X.u(BH) } });
    board.appendChild(X.el('div', { class:'board__grid' }));
    board.appendChild(X.el('div', {
      style:{ position:'absolute', left:X.u(OX), top:0, width:X.u(160 * K), height:X.u(90 * K) },
      html: X.ART.planBackground()
    }));

    const countEl = X.el('span', { class:'puzzle__count', text:'要素 0 / 4' });
    const barFill = X.el('div', { class:'bar__fill' });
    const note = X.el('div', { class:'puzzle__note', text:P.text });
    board.appendChild(X.el('div', {
      style:{ position:'absolute', left:'calc(var(--u) * 1.4)', top:'calc(var(--u) * 1)', width:'calc(var(--u) * 30)' }
    },
      X.el('div', { class:'t-archive', text:'S17 · 陵园平面' }),
      X.el('div', { class:'puzzle__bar', style:{ marginTop:'calc(var(--u) * .8)' } },
        X.el('div', { class:'bar' }, barFill), countEl)
    ));

    const actRow = X.el('div', { class:'puzzle__acts' });
    root.appendChild(X.el('div', { class:'s__content puzzle' },
      board,
      X.el('div', { class:'col', style:{ alignItems:'center', gap:'calc(var(--u) * 1)' } },
        note,
        X.el('div', { class:'puzzle__note t-cap', text:'把散落的空间要素拖回它们在平面上的位置。' }),
        actRow)
    ));

    const homes = { mound:[70,8], road:[79,20], pavil:[67,25], corner:[77,28] };
    const pieces = P.pieces.map(p => {
      const b = p.box;
      return {
        id:p.id, slotId:p.id,
        svg: X.ART.planPiece(p.art, b),
        w: b[2] * K, h: b[3] * K,
        home: homes[p.id],
        slot: [ OX + (b[0] + b[2]/2) * K, (b[1] + b[3]/2) * K ],
        rot:0, needRot:0
      };
    });

    X.puzzle({
      board, pieces, tolerance:6,
      onCreateSlot(p){
        const b = P.pieces.filter(q => q.id === p.id)[0].box;
        return X.el('div', { class:'slot', style:{
          left:X.u(OX + (b[0] + b[2]/2) * K), top:X.u((b[1] + b[3]/2) * K),
          width:X.u(b[2] * K), height:X.u(b[3] * K)
        }},
          X.el('span', { class:'slot__mark', text: P.pieces.filter(q => q.id === p.id)[0].name }));
      },
      onPlaced(p, n){
        countEl.textContent = '要素 ' + n + ' / 4';
        barFill.style.width = (n / 4 * 100) + '%';
        const name = P.pieces.filter(q => q.id === p.id)[0].name;
        note.textContent = name + '已就位。';
      },
      onFail(p, reason){
        X.toast(D.tips.planFail, { type:'warn' });
        note.textContent = '位置似乎不对。想想陵园的轴线从哪里开始。';
      },
      onComplete(){
        X.state().planDone = true;
        X.relic('relic03').found = true;
        X.relic('relic03').archived = true;
        X.save();
        X.sfx.chime();
        X.flash();
        note.textContent = '“你开始理解这座陵园的秩序。”';
        X.hudUpdate('shard');
        X.toast('获得：琉璃脊饰残件（遗珍 #003）', { type:'gold' });
        X.later(() => {
          actRow.appendChild(X.btn('完成重建 · 进入遗珍库', { variant:'primary', pulse:true, onClick(){ X.go('s18'); } }));
        }, 1500);
      }
    });

    if (done){
      countEl.textContent = '已完成';
      barFill.style.width = '100%';
      note.textContent = '陵园的秩序已经重建。';
      actRow.appendChild(X.btn('进入遗珍库', { variant:'primary', onClick(){ X.go('s18'); } }));
    }
  }
});

/* ------------------------------------------------------------
   S18 遗珍库（同时是图鉴入口）
   ------------------------------------------------------------ */
X.entries = function(){
  const s = X.state();
  const list = [];
  D.relicOrder.forEach((id, i) => {
    const r = X.relic(id);
    list.push({
      key:id, cat:'遗珍', no:'#' + D.relics[id].no,
      name: D.relics[id].name,
      unlocked: !!r.archived || !!r.found,
      art: function(){ return X.ART.relic(id); },
      detail: function(){ return X.relicDetail(id); }
    });
  });
  D.glyphOrder.forEach((gid, i) => {
    const g = D.glyphs[gid];
    list.push({
      key:gid, cat:'文字', no:'字' + (i+1),
      name:'「' + g.meaning + '」',
      unlocked: !!(s.glyphs[gid] && s.glyphs[gid].matched),
      art: function(){ return X.ART.glyphSvg(gid); },
      detail: function(){
        return { title:'西夏文字 · ' + g.meaning, art:'', fields:[
          { k:'字形', v:'示意性复现字形' },
          { k:'含义', v:g.meaning + '（' + g.note + '）' },
          { k:'出处', v:'西夏陵 · 碑亭区域 · 石碑' }
        ], quote:'当文字再次被理解，沉睡的历史便多了一种声音。', note:D.meta.disclaimer };
      }
    });
  });
  D.gardenScene.clues.forEach((c, i) => {
    list.push({
      key:c.id, cat:'空间', no:'空' + (i+1),
      name:c.name,
      unlocked: !!s.siteClues[c.id],
      art: function(){ return X.ART.zoomView(c.art); },
      detail: function(){
        return { title:'空间线索 ' + c.no + ' · ' + c.name, art:'', fields:[
          { k:'类别', v:'陵园空间要素' },
          { k:'位置', v:'西夏陵 · 陵园区域' }
        ], quote:c.text, note:D.meta.disclaimer };
      }
    });
  });
  list.push({
    key:'mosaic', cat:'遗址', no:'域1',
    name:'陵园全景',
    unlocked: !!s.mosaicDone,
    art: function(){ return X.ART.sceneGarden('restored'); },
    detail: function(){
      return { title:'遗址 · 陵园全景复原', art:'', fields:[
        { k:'类别', v:'遗址格局' },
        { k:'构成', v:'陵台 · 神道 · 碑亭 · 角台 · 兆域' }
      ], quote:'你开始理解这座陵园的秩序。', note:D.meta.disclaimer };
    }
  });
  return list;
};

/* 遗珍详情 */
X.relicDetail = function(id){
  const R = D.relics[id];
  const fields = [
    { k:'类别', v:R.category },
    { k:'时代', v:R.era },
    { k:'发现信息', v:R.site }
  ];
  Object.keys(R.clues || {}).forEach(k => {
    fields.push({ k:{ pattern:'纹样', material:'材质', form:'形制' }[k] || k, v:R.clues[k] });
  });
  return { title:'遗珍 #' + R.no + ' · ' + R.name, art:X.ART.relic(id), fields, quote:R.oneLine, note:D.meta.disclaimer };
};

X.openDetail = function(data){
  const body = X.el('div', { class:'detail' });
  if (data.art){
    body.appendChild(X.el('div', { class:'detail__img', html:data.art }));
  }
  const right = X.el('div');
  (data.fields || []).forEach(f => right.appendChild(X.el('div', { class:'field' },
    X.el('div', { class:'field__k', text:f.k }),
    X.el('div', { class:'field__v', text:f.v }))));
  if (data.quote) right.appendChild(X.el('div', { class:'s10__quote' },
    X.el('div', { class:'t-h3', text: data.quote })));
  if (data.note) right.appendChild(X.el('div', { class:'t-cap', style:{ marginTop:'calc(var(--u) * 1.4)' }, text:data.note }));
  body.appendChild(right);
  X.modal({ title: data.title, body, actions:[{ label:'关闭' }], width:64 });
};

X.registerScreen('s18', {
  className: 's--center',
  mount(root){
    root.classList.add('s18');
    X.state().vaultOpen = true;
    X.save();
    const list = X.entries();
    const found = list.filter(e => e.unlocked).length;

    X.hud({ back:true, backTo:'s04', chapter:'西夏遗珍图鉴', tag:'S18 · 遗珍库',
            onShard(){ X.toast('碎片即图鉴条目：共 ' + X.shardsTotal() + ' 件。'); } });
    X.nav('s18');

    const grid = X.el('div', { class:'s18__grid' });
    list.forEach((e, i) => {
      const card = X.el('div', {
        class:'slotcard' + (e.unlocked ? ' is-open' : ' is-locked'),
        on:{ click(){
          if (!e.unlocked){ X.sfx.fail(); X.toast('这一格还没有被点亮。'); return; }
          X.sfx.tick();
          X.openDetail(e.detail());
        } }
      },
        X.el('div', { class:'slotcard__no', text: e.no }),
        X.el('div', { class:'slotcard__art', html: e.unlocked ? e.art() : '' }),
        X.el('div', { class:'slotcard__name', text: e.unlocked ? e.name : '？？？' })
      );
      if (!e.unlocked) card.querySelector('.slotcard__art').innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="rgba(232,221,197,.3)" stroke-width="1.2">' +
        '<path d="M12 4 C7 4 4 7 4 12 C4 17 7 20 12 20 C14 20 16 19 16 17 C16 15 13 16 13 13 C13 10 16 11 19 12"/>' +
        '<path d="M12 4 L12 20" opacity=".4"/></svg>';
      grid.appendChild(card);
    });

    const acts = X.el('div', { class:'row', style:{ marginTop:'calc(var(--u) * 2)', justifyContent:'center', gap:'calc(var(--u) * 2)' } },
      X.btn('把线索连起来', { variant:'primary', onClick(){
        if (!X.flag('planDone')){ X.toast('先把陵园平面重建完成。', { type:'warn' }); return; }
        X.go('s19');
      }}),
      X.btn('返回地图', { variant:'ghost', onClick(){ X.go('s04'); } })
    );

    root.appendChild(X.el('div', { class:'s__content stack', style:{ gap:'calc(var(--u) * 1.6)' } },
      X.el('div', { class:'row', style:{ justifyContent:'space-between', width:'100%' } },
        X.el('div', { class:'col' },
          X.el('div', { class:'t-kicker', text:'S18 · 西夏遗珍图鉴' }),
          X.el('div', { class:'t-h2', style:{ marginTop:'calc(var(--u) * .6)' },
            text:'已记录 ' + found + ' / ' + X.shardsTotal() + ' 件' })),
        X.el('div', { class:'s18__legend' },
          X.chip('遗珍 · 文字 · 建筑 · 遗址'),
          X.chip('？？？ 未发现', 'locked'))),
      grid,
      X.el('div', { class:'t-cap t-center', text:'“收集遗物，拼起历史。”' }),
      acts
    ));
  }
});

/* ------------------------------------------------------------
   S19 线索关联 · 西夏记忆网络
   ------------------------------------------------------------ */
X.registerScreen('s19', {
  className: 's--center',
  mount(root){
    root.classList.add('s19');
    const L = D.links;
    const s = X.state();
    const BW = 96, BH = 36;
    const ROWS = [4, 13.33, 22.67, 32];

    X.hud({ back:true, backTo:'s18', chapter:'第四章 · 遗珍库', tag:'S19 · 线索关联' });

    const board = X.el('div', { class:'s19__board', style:{ width:X.u(BW), height:X.u(BH) } });
    const svg = X.el('div', {
      style:{ position:'absolute', inset:'0' },
      html: '<svg viewBox="0 0 ' + BW + ' ' + BH + '" style="width:100%;height:100%">' +
            '<g stroke="rgba(233,216,180,.12)" stroke-width=".4">' +
            ROWS.map(y => '<path d="M0,' + y + ' L' + BW + ',' + y + '"/>').join('') +
            '</g><g id="netlines"></g></svg>'
    });
    board.appendChild(svg);

    const leftCol = X.el('div', { class:'s19__col s19__col--l' });
    const rightCol = X.el('div', { class:'s19__col s19__col--r' });
    const nodeMap = {};

    L.left.forEach((n, i) => {
      const done = !!s.links[n.id];
      const el = X.el('div', { class:'lnode' + (done ? ' is-done' : ''), data:{ id:n.id, side:'l', idx:i },
        on:{ click(){ selectLeft(el, n, i); } } },
        X.el('div', { class:'lnode__icon', html: X.ART.icon(n.icon) }),
        X.el('div', { class:'lnode__txt' },
          X.el('b', { text:n.name }), X.el('span', { text:n.sub })),
        X.el('div', { class:'lnode__pin' })
      );
      nodeMap['l_' + n.id] = el;
      leftCol.appendChild(el);
    });
    L.right.forEach((n, i) => {
      const el = X.el('div', { class:'lnode', data:{ id:n.id, side:'r', idx:i },
        on:{ click(){ selectRight(el, n, i); } } },
        X.el('div', { class:'lnode__pin' }),
        X.el('div', { class:'lnode__icon', html: X.ART.icon(n.icon) }),
        X.el('div', { class:'lnode__txt' },
          X.el('b', { text:n.name }), X.el('span', { text:n.sub }))
      );
      nodeMap['r_' + n.id] = el;
      rightCol.appendChild(el);
    });
    board.appendChild(leftCol);
    board.appendChild(rightCol);
    board.appendChild(X.el('div', { class:'s19__center' },
      X.el('div', { class:'t-archive', text:'西夏记忆网络' }),
      X.el('div', { class:'t-cap', style:{ marginTop:'calc(var(--u) * .4)' }, text:'点击左侧线索，再点击右侧对应项' })
    ));

    const note = X.el('div', { class:'t-quote t-center', style:{ maxWidth:'calc(var(--u) * 66)' },
      text:'文物、文字、建筑、遗址——它们各自说出了历史的一个侧面。' });
    const actRow = X.el('div', { class:'puzzle__acts' });
    const counter = X.el('span', { class:'puzzle__count', text: Object.keys(s.links).length + ' / 4' });

    root.appendChild(X.el('div', { class:'s__content stack', style:{ gap:'calc(var(--u) * 1.4)' } },
      X.el('div', { class:'row', style:{ justifyContent:'space-between', width:'calc(var(--u) * 96)' } },
        X.el('div', { class:'t-kicker', text:'S19 · 把线索连起来' }),
        X.el('div', { class:'row' }, X.el('span', { class:'t-archive', text:'已连接' }), counter)),
      board,
      note,
      actRow
    ));

    let selected = null;

    /* 恢复已连接 */
    L.left.forEach((n, i) => {
      if (s.links[n.id]) drawLink(i, indexOfRight(s.links[n.id]), true);
    });
    if (Object.keys(s.links).length >= 4) finish(true);

    function indexOfRight(id){ return L.right.map(r => r.id).indexOf(id); }

    function selectLeft(el, n, i){
      X.sfx.tick();
      document.querySelectorAll('.lnode.is-sel').forEach(x => x.classList.remove('is-sel'));
      if (s.links[n.id]){ X.toast('这条线索已经连接完成。'); return; }
      selected = { el, n, i };
      el.classList.add('is-sel');
      note.textContent = '“' + n.name + '”让你想到什么？在右侧选择一项。';
    }

    function selectRight(el, n, i){
      if (!selected){
        X.toast('先选择左侧的一条线索。');
        return;
      }
      const left = selected.n;
      if (left.to === n.id){
        X.sfx.ok();
        X.state().links[left.id] = n.id;
        X.save();
        drawLink(selected.i, i, false);
        selected.el.classList.remove('is-sel');
        selected.el.classList.add('is-done');
        el.classList.add('is-done');
        counter.textContent = Object.keys(X.state().links).length + ' / 4';
        X.hudUpdate('memory');
        note.innerHTML = '';
        note.appendChild(X.el('div', { class:'t-h3 t-gold', text:'“' + left.name + '” 指向 “' + n.name + '”' }));
        X.later(() => {
          note.textContent = Object.keys(X.state().links).length >= 4
            ? '所有线索连成一张网络。'
            : '继续连接剩下的线索。';
        }, 1600);
        selected = null;
        if (Object.keys(X.state().links).length >= 4) finish(false);
      } else {
        X.sfx.fail();
        X.shake(el);
        el.classList.add('is-wrong');
        X.later(() => el.classList.remove('is-wrong'), 1200);
        X.toast(L.wrongText, { type:'warn' });
      }
    }

    function drawLink(li, ri, instant){
      const g = svg.querySelector('#netlines');
      const y1 = ROWS[li], y2 = ROWS[ri];
      const d = 'M32,' + y1 + ' C48,' + y1 + ' 48,' + y2 + ' 64,' + y2;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', 'var(--gold)');
      p.setAttribute('stroke-width', '1');
      p.setAttribute('opacity', '.85');
      g.appendChild(p);
      if (instant){
        p.setAttribute('opacity', '.65');
      } else {
        const len = p.getTotalLength ? p.getTotalLength() : 300;
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        p.animate([{ strokeDashoffset:len }, { strokeDashoffset:0 }], { duration:700, easing:'cubic-bezier(.3,.7,.3,1)' });
        p.style.strokeDashoffset = 0;
      }
      /* 中心节点 */
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', 48); dot.setAttribute('cy', (y1 + y2) / 2);
      dot.setAttribute('r', '1.4');
      dot.setAttribute('fill', 'var(--gold)');
      g.appendChild(dot);
    }

    function finish(silent){
      X.state().networkDone = true;
      X.relic('relic04').found = true;  X.relic('relic04').archived = true;
      X.relic('relic05').found = true;  X.relic('relic05').archived = true;
      X.save();
      note.innerHTML = '';
      note.appendChild(X.el('div', { class:'t-h3 t-gold', text:'西夏记忆网络' }));
      note.appendChild(X.el('div', { class:'t-cap', style:{ marginTop:'calc(var(--u) * .6)' },
        text:'文物 · 生活 ｜ 文字 · 记录 ｜ 建筑 · 空间 ｜ 遗址 · 历史' }));
      actRow.innerHTML = '';
      actRow.appendChild(X.btn('关联解锁 · 查看新增遗珍', { variant:'ghost', onClick(){ X.go('s18'); } }));
      actRow.appendChild(X.btn('前往记忆之门', { variant:'primary', pulse:true, onClick(){ X.go('s20'); } }));
      if (!silent){
        X.sfx.chime();
        X.flash();
        X.toast('关联解锁：铜铃残件 · 陶塑人像残件', { type:'gold' });
        X.hudUpdate('shard');
      }
    }
  }
});

})();

</script>
<script>
/* ============================================================
   《寻夏》 — screens-final.js
   S20 记忆之门 / S21 最终拼图 / S22 寻迹完成
   S23 遗珍再生（文创转化）/ S24 我的寻夏档案
   ============================================================ */
(function(){
const X = window.X, D = X.DATA;

/* ------------------------------------------------------------
   S20 记忆之门
   ------------------------------------------------------------ */
function gateArt(){
  const eng = (mirror) =>
    '<g ' + (mirror ? 'transform="translate(60,0) scale(-1,1)"' : '') + '>' +
      '<path d="M8,8 L52,8 L52,112 L8,112 Z" fill="#3a2b1d" stroke="#6a5334" stroke-width="1"/>' +
      '<path d="M12,12 L48,12 L48,108 L12,108 Z" fill="#2c2016" stroke="#4a3a24" stroke-width=".6"/>' +
      /* 西夏文字刻痕 */
      '<g stroke="#c9a15c" stroke-width="1.1" fill="none" opacity=".8">' +
        '<path d="M18,22 L42,21 L41,44 L19,45 Z"/><path d="M19,33 L41,32.5"/><path d="M30,23 L30,44"/>' +
        '<path d="M20,52 L40,51 L40,66 L21,67 Z"/><path d="M24,58 L36,57"/><path d="M30,53 L30,65"/>' +
      '</g>' +
      /* 纹样 */
      '<g stroke="#c9a15c" stroke-width=".9" fill="none" opacity=".6">' +
        '<path d="M30,74 A12,12 0 0 1 18,86"/><path d="M30,78 A8,8 0 0 1 22,86"/>' +
        '<path d="M30,74 A12,12 0 0 0 42,86"/><path d="M30,78 A8,8 0 0 0 38,86"/>' +
      '</g>' +
      /* 建筑轮廓 */
      '<g stroke="#8a6b3a" stroke-width=".9" fill="none" opacity=".65">' +
        '<path d="M18,104 L20,94 L30,89 L40,94 L42,104"/>' +
      '</g>' +
      '<circle cx="44" cy="60" r="2.4" fill="#8a6b3a"/>' +
    '</g>';
  return '<svg viewBox="0 0 60 120" preserveAspectRatio="xMidYMid meet" style="overflow:visible">' +
      eng(false) + eng(true) +
    '</svg>';
}

X.registerScreen('s20', {
  className: 's--center',
  mount(root){
    root.classList.add('s20');
    const opened = X.state().gateOpen;
    let filled = opened;

    X.hud({ back:true, backTo:'s04', chapter:'终章 · 记忆之门', tag:'S20 · 记忆之门' });

    root.appendChild(X.el('div', { class:'s__bg', html: X.ART.sceneGarden('ruin') }));
    root.appendChild(X.el('div', {
      class:'s__bg', style:{ background:'radial-gradient(60% 60% at 50% 50%, rgba(6,5,4,.35), rgba(6,5,4,.85))' }
    }));

    const gateWrap = X.el('div', { class:'s20__gate' });
    const leaves = X.node(gateArt());
    gateWrap.appendChild(leaves);
    root.appendChild(gateWrap);

    const socketDefs = [
      { id:'glyph', label:'西夏文字', icon:'glyph' },
      { id:'relic', label:'文物纹样', icon:'relic' },
      { id:'arch',  label:'陵园轮廓', icon:'arch' }
    ];
    const socketNodes = {};
    const sockets = X.el('div', { class:'s20__sockets' });
    socketDefs.forEach(sd => {
      const n = X.el('div', { class:'socket' },
        X.el('div', { style:{ width:'calc(var(--u) * 5)', height:'calc(var(--u) * 5)' }, html: X.ART.icon(sd.icon) }),
        X.el('div', { class:'socket__label', text: sd.label })
      );
      if (opened) n.classList.add('is-on');
      socketNodes[sd.id] = n;
      sockets.appendChild(n);
    });
    root.appendChild(sockets);
    const burst = X.el('div', { class:'s20__burst' });
    root.appendChild(burst);

    const linesBox = X.el('div', { class:'s20__lines' },
      X.el('div', { class:'t-h2', text:'“你已经找回了许多碎片。”' }),
      X.el('div', { class:'t-h2', style:{ marginTop:'calc(var(--u) * .8)' }, text:'“现在，请把它们放回历史。”' })
    );
    root.appendChild(linesBox);

    const actRow = X.el('div', {
      class:'row', style:{ position:'absolute', bottom:'calc(var(--u) * 12)', left:'0', right:'0',
      justifyContent:'center', gap:'calc(var(--u) * 2)', zIndex:8 }
    });
    root.appendChild(actRow);

    if (opened) showEnter();
    else {
      actRow.appendChild(X.btn('放入碎片', { variant:'primary', pulse:true, onClick(){ fillAll(); } }));
    }

    function fillAll(){
      actRow.innerHTML = '';
      const ids = socketDefs.map(s => s.id);
      ids.forEach((id, i) => {
        X.later(() => {
          socketNodes[id].classList.add('is-on');
          X.sfx.snap();
          linesBox.querySelectorAll('.t-h2').forEach((n, k) => {
            if (k === i) n.classList.add('t-gold');
          });
          if (i === ids.length - 1){
            X.later(openGate, 700);
          }
        }, i * 700);
      });
    }

    function openGate(){
      X.state().gateOpen = true;
      X.save();
      X.sfx.crack();
      burst.classList.add('is-on');
      /* 门扇分开 */
      const svg = leaves;
      if (svg){
        svg.style.transition = 'transform 2.2s cubic-bezier(.3,.7,.3,1), opacity 2.2s';
        svg.style.transform = 'scale(1.06)';
      }
      X.later(() => {
        X.sfx.chime();
        X.flash();
        linesBox.innerHTML = '';
        linesBox.appendChild(X.el('div', { class:'t-h1 t-gold', text:'记忆之门已开启' }));
        linesBox.appendChild(X.el('div', { class:'t-quote', style:{ marginTop:'calc(var(--u) * 1)' },
          text:'碎片被放回它们原来的位置。' }));
        showEnter();
      }, 1600);
    }

    function showEnter(){
      actRow.innerHTML = '';
      actRow.appendChild(X.btn('进入记忆之门', { variant:'primary', pulse:true, onClick(){ X.go('s21'); } }));
    }
  }
});

/* ------------------------------------------------------------
   S21 最终拼图 · 重建记忆
   ------------------------------------------------------------ */
X.registerScreen('s21', {
  className: 's--center',
  mount(root){
    root.classList.add('s21');
    const done = X.state().mosaicDone;
    const cells = X.ART.mosaicCells();
    const CW = 20, CH = 11.25;                       // 单块尺寸（u）
    const BW = CW * 3, BH = CH * 3;

    X.hud({ back:true, backTo:'s20', chapter:'终章 · 记忆之门', tag:'S21 · 重建记忆' });

    const board = X.el('div', { class:'puzzle__board', style:{ width:X.u(BW), height:X.u(BH) } });
    board.appendChild(X.el('div', { class:'board__grid' }));

    /* 九宫格槽位（视觉） */
    cells.forEach((c, i) => {
      board.appendChild(X.el('div', { class:'s21__cell', style:{
        left:X.u((i % 3) * CW), top:X.u(Math.floor(i / 3) * CH),
        width:X.u(CW), height:X.u(CH)
      }}));
    });

    /* 完成后的完整画面 */
    const doneScene = X.el('div', { class:'s21__doneScene' + (done ? ' is-on' : ''),
      html: X.ART.sceneGarden('restored') });
    const dust = X.el('div', { class:'s21__dust' });

    const countEl = X.el('span', { class:'puzzle__count', text:'记忆 0 / 9' });
    const barFill = X.el('div', { class:'bar__fill' });
    const note = X.el('div', { class:'puzzle__note', text:D.tips.mosaic });
    const actRow = X.el('div', { class:'puzzle__acts' });

    root.appendChild(X.el('div', { class:'s__content', style:{
      flexDirection:'row', alignItems:'center', gap:'calc(var(--u) * 3.4)', justifyContent:'center'
    } },
      board,
      X.el('div', { class:'col', style:{ width:'calc(var(--u) * 24)', gap:'calc(var(--u) * 1.4)' } },
        X.el('div', { class:'t-archive', text:'S21 · 重建记忆' }),
        X.el('div', { class:'t-h3', text:'把九块记忆放回原位' }),
        X.el('div', { class:'puzzle__bar' }, X.el('div', { class:'bar' }, barFill), countEl),
        note,
        X.el('div', { class:'puzzle__note t-cap', text:'拖到正确的位置即会自动吸附 · 点击可旋转' }),
        actRow)
    ));

    /* 打散偏移（确定性，保证每次一致） */
    const offsets = [ [-3.4,-2.6], [2.6,-3.1], [-2.1,3.0], [3.1,2.6], [-3.2,.4], [3.0,-2.2],
                      [-2.6,3.1], [2.2,-3.2], [-3.0,2.2] ];
    const rotTable = { 2:180, 5:270, 7:90 };

    const pieces = cells.map((c, i) => ({
      id:'c' + i, slotId:'c' + i,
      svg: X.ART.mosaicPiece(i, c.box),
      w: CW, h: CH,
      home: [ (i % 3) * CW + CW/2 + offsets[i][0], Math.floor(i / 3) * CH + CH/2 + offsets[i][1] ],
      slot: [ (i % 3) * CW + CW/2, Math.floor(i / 3) * CH + CH/2 ],
      rot: rotTable[i] || 0, needRot: 0
    }));

    if (done){
      board.appendChild(doneScene);
      countEl.textContent = '已完成';
      barFill.style.width = '100%';
      note.textContent = '记忆已经重光。';
      actRow.appendChild(X.btn('见证记忆重光', { variant:'primary', onClick(){ X.go('s22'); } }));
    } else {
      const puzzle = X.puzzle({
        board, pieces, rotate:true, tolerance:9.4,
        onPlaced(p, n){
          countEl.textContent = '记忆 ' + n + ' / 9';
          barFill.style.width = (n / 9 * 100) + '%';
          note.textContent = ['一块记忆回到了原位。','画面开始恢复。','沙尘正在散去。'][n % 3];
          if (n >= 9) reveal();
        },
        onFail(p, reason){
          if (reason === 'rot'){ note.textContent = '这一块的方向不对。'; X.toast('轮廓接不上，试着旋转这一块。', { type:'warn' }); }
          else if (reason === 'wrong-slot'){ note.textContent = '这一块与旁边的纹路接不上。'; X.toast(D.tips.cellFail, { type:'warn' }); }
          else { note.textContent = '把这一块放回画面里。'; }
        }
      });
    }

    function reveal(){
      X.state().mosaicDone = true;
      X.save();
      note.textContent = '记忆重光';
      board.appendChild(dust);
      dust.classList.add('is-on');
      X.sfx.whoosh();
      X.later(() => {
        board.querySelectorAll('.piece').forEach(n => {
          n.style.transition = 'opacity .9s';
          n.style.opacity = '0';
        });
        board.appendChild(doneScene);
        doneScene.classList.add('is-on');
        X.sfx.chime();
        X.hudUpdate('shard');
      }, 900);
      X.later(() => {
        actRow.appendChild(X.btn('见证记忆重光', { variant:'primary', pulse:true, onClick(){ X.go('s22'); } }));
      }, 3400);
    }
  }
});

/* ------------------------------------------------------------
   S22 寻迹完成
   ------------------------------------------------------------ */
X.registerScreen('s22', {
  className: 's--center',
  mount(root){
    root.classList.add('s22');
    const sum = X.summary();
    const s = X.state();
    const idn = D.identities.filter(i => i.id === s.identity)[0] || D.identities[0];

    root.appendChild(X.el('div', { class:'s__bg', html: X.ART.sceneGarden('restored'),
      style:{ opacity:'0.35' } }));

    const stats = [
      { n:sum.relics,  unit:'件', label:'发现遗珍' },
      { n:sum.glyphs,  unit:'组', label:'解读文字' },
      { n:sum.sites,   unit:'处', label:'探索遗址空间' },
      { n:sum.repairs, unit:'件', label:'修复文物' }
    ];
    const statNodes = stats.map(st =>
      X.el('div', { class:'statbox' },
        X.el('div', { class:'statbox__n', html:'<span>0</span><small>' + st.unit + '</small>' }),
        X.el('div', { class:'statbox__k', text: st.label })));

    const titleBox = X.el('div', { class:'s22__titlebox' },
      X.el('div', { class:'s22__title', text:'寻迹完成' }),
      X.el('div', { class:'s22__seal seal seal--big', text:'西夏遗珍守护者' })
    );

    root.appendChild(X.el('div', { class:'s__content stack', style:{ gap:'calc(var(--u) * 2.4)' } },
      X.el('div', { class:'t-kicker', text:'S22 · 结算' }),
      titleBox,
      X.el('div', { class:'t-quote t-center', text:'你找回了 ' + sum.relics + ' 件遗珍 · 解读了 ' + sum.glyphs +
        ' 组文字 · 探索了 ' + sum.sites + ' 处遗址空间 · 修复了 ' + sum.repairs + ' 件文物' }),
      X.el('div', { class:'s22__stats' }, statNodes),
      X.el('div', { class:'t-h3', text:'获得称号' }),
      X.el('div', { class:'t-h1 t-gold', text:'「西夏遗珍守护者」' }),
      X.el('div', { class:'row', style:{ gap:'calc(var(--u) * 2)', marginTop:'calc(var(--u) * 1)' } },
        X.btn('让遗珍重新出现', { variant:'primary', pulse:true, onClick(){ X.go('s23'); } }),
        X.btn('查看我的档案', { variant:'ghost', onClick(){ X.go('s24'); } }))
    ));

    /* 数字滚动 */
    statNodes.forEach((boxN, i) => {
      const span = boxN.querySelector('.statbox__n span');
      const target = stats[i].n;
      let v = 0;
      const t = X.loop(() => {
        v++;
        span.textContent = String(v);
        if (v >= target) clearInterval(t);
      }, 260 / Math.max(1, target) + 60);
    });
    X.sfx.chime();
  }
});

/* ------------------------------------------------------------
   S23 遗珍再生（文创转化）
   ------------------------------------------------------------ */
X.registerScreen('s23', {
  className: 's--center',
  mount(root){
    root.classList.add('s23');
    const R = D.regenerating;
    const already = X.state().regenerated;

    X.hud({ back:true, backTo:'s22', chapter:'遗珍再生', tag:'S23 · 文物 → 纹样 → 文创' });

    const stageNodes = R.steps.map(st =>
      X.el('div', { class:'s23__stage' + (already ? ' is-on' : '') },
        X.el('div', { html: X.ART.motif(st.id) }),
        X.el('div', { class:'s23__stageName', text: st.name }),
        X.el('div', { class:'s23__stageDesc', text: st.desc })));
    const flow = X.el('div', { class:'s23__flow' });
    stageNodes.forEach((n, i) => {
      flow.appendChild(n);
      if (i < stageNodes.length - 1) flow.appendChild(X.el('div', { class:'s23__arrow', text:'↓' }));
    });

    const productNodes = R.products.map(p =>
      X.el('div', { class:'product' + (already ? ' is-on' : '') },
        X.el('div', { html: X.ART.product(p.id) }),
        X.el('b', { text:p.name }),
        X.el('span', { text:p.desc })));

    const cta = X.el('div', { class:'row', style:{ justifyContent:'center', marginTop:'calc(var(--u) * 2)' } });
    if (already){
      cta.appendChild(X.btn('进入我的寻夏档案', { variant:'primary', onClick(){ X.go('s24'); } }));
    } else {
      cta.appendChild(X.btn('让遗珍重新出现', { variant:'primary', pulse:true, onClick: run }));
    }

    root.appendChild(X.el('div', { class:'s__content stack', style:{
      gap:'calc(var(--u) * 1)', padding:'calc(var(--u) * 5) calc(var(--u) * 5)'
    } },
      X.el('div', { class:'t-kicker', text:'S23 · 遗珍再生 · 文物 → 纹样 → 文创' }),
      X.el('div', { class:'t-quote t-center', style:{ fontSize:'calc(var(--u) * 1.5)' }, text:'“' + R.quote + '”' }),
      flow,
      X.el('div', { class:'t-archive', text:'纹样系统 · 文创产品延展' }),
      X.el('div', { class:'s23__products' }, productNodes),
      cta
    ));

    function run(){
      X.state().regenerated = true;
      X.save();
      cta.innerHTML = '';
      X.sfx.crack();
      stageNodes.forEach((n, i) => {
        X.later(() => {
          n.classList.add('is-on');
          X.sfx.tick();
          if (i === stageNodes.length - 1){
            X.later(() => {
              productNodes.forEach((p, k) => X.later(() => { p.classList.add('is-on'); X.sfx.ok(); }, k * 260));
              X.later(() => {
                cta.appendChild(X.btn('进入我的寻夏档案', { variant:'primary', pulse:true, onClick(){ X.go('s24'); } }));
              }, 1400);
            }, 500);
          }
        }, 700 * (i + 1));
      });
    }
  }
});

/* ------------------------------------------------------------
   S24 我的寻夏档案 + 生成遗珍卡
   ------------------------------------------------------------ */
X.registerScreen('s24', {
  className: 's--center',
  mount(root){
    root.classList.add('s24');
    const sum = X.summary();
    const s = X.state();
    const idn = D.identities.filter(i => i.id === s.identity)[0] || D.identities[0];
    const list = X.entries().filter(e => e.unlocked);

    X.hud({ back:true, backTo:'s04', chapter:'我的寻夏档案', tag:'S24 · 档案与分享' });

    const paper = X.el('div', { class:'card card--paper', style:{ padding:'calc(var(--u) * 2)' } },
      X.el('div', { class:'card__no', text:'XUNXIA ARCHIVE · ' + new Date().getFullYear() }),
      X.el('div', { class:'t-h2', style:{ margin:'calc(var(--u) * 1) 0' }, text:'我的寻夏档案' }),
      X.el('div', { class:'row', style:{ gap:'calc(var(--u) * 1.2)' } },
        X.chip(idn.name), X.chip('西夏陵 · 遗址探索')),
      X.el('div', { class:'rule' }),
      X.el('div', { class:'s24__stats' },
        X.el('div', { class:'statline' }, X.el('span', { text:'探索进度' }), X.el('b', { text: sum.progress + '%' })),
        X.el('div', { class:'statline' }, X.el('span', { text:'记忆值' }), X.el('b', { text: String(sum.memory) })),
        X.el('div', { class:'statline' }, X.el('span', { text:'发现遗珍' }), X.el('b', { text: sum.relics + ' / 5' })),
        X.el('div', { class:'statline' }, X.el('span', { text:'解读文字' }), X.el('b', { text: sum.glyphs + ' / 3' })),
        X.el('div', { class:'statline' }, X.el('span', { text:'修复文物' }), X.el('b', { text: sum.repairs + ' / 3' })),
        X.el('div', { class:'statline' }, X.el('span', { text:'遗址空间' }), X.el('b', { text: sum.sites + ' / 3' }))
      ),
      X.el('div', { class:'rule' }),
      X.el('div', { class:'s24__chips' },
        list.map(e => X.el('span', { class:'chip' + (e.cat === '遗珍' ? ' chip--gold' : ''), text: e.name }))),
      X.el('div', { class:'row', style:{ justifyContent:'space-between', marginTop:'calc(var(--u) * 1.2)' } },
        X.el('span', { class:'seal', text:'西夏遗珍守护者' }),
        X.el('span', { class:'t-archive', text: D.meta.version }))
    );

    const preview = X.el('div', { class:'s24__preview' });
    const acts = X.el('div', { class:'col', style:{ gap:'calc(var(--u) * 1.2)', width:'calc(var(--u) * 34)' } },
      X.btn('生成我的遗珍卡', { variant:'primary', onClick(){ makeCard(); } }),
      X.btn('继续探索', { variant:'ghost', onClick(){ X.go('s04'); } }),
      X.el('div', { class:'t-cap', text:'遗珍卡为 1600×1000 PNG，可直接保存分享。' })
    );

    root.appendChild(X.el('div', { class:'s__content' },
      X.el('div', { class:'t-kicker', style:{ marginBottom:'calc(var(--u) * 1.6)' }, text:'S24 · 我的寻夏档案' }),
      X.el('div', { class:'s24__wrap' }, paper,
        X.el('div', { class:'col', style:{ gap:'calc(var(--u) * 1.6)' } }, acts, preview))
    ));

    function makeCard(){
      X.state().cardMade = true;
      X.save();
      X.sfx.stamp();
      try {
      const cv = document.createElement('canvas');
      cv.width = 1600; cv.height = 1000;
      const g = cv.getContext('2d');
      if (!g) throw new Error('当前环境不支持 Canvas 2D');

      /* 背景 */
      const bg = g.createLinearGradient(0, 0, 1600, 1000);
      bg.addColorStop(0, '#1b1410'); bg.addColorStop(.55, '#0f0b08'); bg.addColorStop(1, '#241a12');
      g.fillStyle = bg; g.fillRect(0, 0, 1600, 1000);
      /* 沙尘光晕 */
      const halo = g.createRadialGradient(1180, 220, 20, 1180, 220, 520);
      halo.addColorStop(0, 'rgba(233,189,110,.35)'); halo.addColorStop(1, 'rgba(233,189,110,0)');
      g.fillStyle = halo; g.fillRect(0, 0, 1600, 1000);
      /* 边框 */
      g.strokeStyle = 'rgba(216,178,106,.75)'; g.lineWidth = 3;
      g.strokeRect(48, 48, 1504, 904);
      g.strokeStyle = 'rgba(216,178,106,.35)'; g.lineWidth = 1;
      g.strokeRect(66, 66, 1468, 868);

      /* 标题 */
      g.fillStyle = '#f2debc';
      g.font = '600 68px "Songti SC", serif';
      g.fillText('我的寻夏档案', 110, 190);
      g.fillStyle = 'rgba(233,189,110,.9)';
      g.font = '24px Consolas, monospace';
      g.fillText('XUNXIA ARCHIVE · ' + new Date().toLocaleDateString('zh-CN'), 112, 236);

      /* 身份 */
      g.fillStyle = 'rgba(232,221,197,.85)';
      g.font = '30px "Songti SC", serif';
      g.fillText('寻迹身份 · ' + idn.name + '　｜　' + idn.perk, 112, 300);

      /* 数字 */
      g.fillStyle = '#f2debc';
      g.font = '600 86px "Songti SC", serif';
      g.fillText(sum.progress + '%', 112, 430);
      g.fillStyle = 'rgba(232,221,197,.7)';
      g.font = '26px "Songti SC", serif';
      g.fillText('探索进度', 112, 470);

      const stats = [
        ['发现遗珍', sum.relics + ' / 5'],
        ['解读文字', sum.glyphs + ' / 3'],
        ['修复文物', sum.repairs + ' / 3'],
        ['遗址空间', sum.sites + ' / 3']
      ];
      stats.forEach((st, i) => {
        const x = 430 + (i % 2) * 360, y = 400 + Math.floor(i / 2) * 150;
        g.fillStyle = '#f2debc';
        g.font = '600 64px "Songti SC", serif';
        g.fillText(st[1], x, y);
        g.fillStyle = 'rgba(232,221,197,.7)';
        g.font = '26px "Songti SC", serif';
        g.fillText(st[0], x, y + 38);
      });

      /* 遗珍清单 */
      g.strokeStyle = 'rgba(216,178,106,.35)';
      g.beginPath(); g.moveTo(112, 600); g.lineTo(1488, 600); g.stroke();
      g.fillStyle = 'rgba(232,221,197,.75)';
      g.font = '26px "Songti SC", serif';
      const names = list.map(e => e.name);
      names.forEach((n, i) => {
        const x = 112 + (i % 4) * 340, y = 660 + Math.floor(i / 4) * 52;
        g.fillText('· ' + n, x, y);
      });

      /* 记忆值 + 落款 */
      g.fillStyle = 'rgba(233,189,110,.9)';
      g.font = '28px Consolas, monospace';
      g.fillText('MEMORY VALUE ' + sum.memory, 112, 890);

      /* 印章 */
      g.save();
      g.translate(1330, 830); g.rotate(-8 * Math.PI / 180);
      g.strokeStyle = 'rgba(156,58,38,.95)'; g.lineWidth = 4;
      g.strokeRect(-130, -46, 260, 92);
      g.fillStyle = 'rgba(156,58,38,.95)';
      g.font = '600 40px "Songti SC", serif';
      g.fillText('西夏遗珍守护者', -116, 14);
      g.restore();

      const url = cv.toDataURL('image/png');
      preview.innerHTML = '';
      const img = X.el('img', { src:url, alt:'我的寻夏档案卡' });
      const dl = X.el('a', {
        href: url, download: '寻夏-我的遗珍卡.png',
        class:'btn btn--primary btn--sm', style:{ marginTop:'calc(var(--u) * 1)' },
        text:'保存图片'
      });
      preview.appendChild(img);
      preview.appendChild(X.el('div', { class:'row', style:{ justifyContent:'center', marginTop:'calc(var(--u) * 1)' } }, dl));
      X.toast('已生成我的遗珍卡', { type:'gold' });
      X.hudUpdate();
      } catch (err){
        console.error('[card]', err);
        X.toast('遗珍卡生成失败：' + (err && err.message ? err.message : '未知错误'), { type:'warn', ms:4200 });
      }
    }
  }
});

})();

</script>
<script>
/* ============================================================
   《寻夏》 — screens-meta.js
   任务清单 / 我的（设置 · 重置 · 关于）
   ============================================================ */
(function(){
const X = window.X, D = X.DATA;

/* ------------------------------------------------------------
   任务
   ------------------------------------------------------------ */
X.registerScreen('tasks', {
  className: 's--center',
  mount(root){
    root.classList.add('tasks');
    X.hud({ back:true, backTo:'s04', chapter:'任务', tag:'TASKS · 寻夏进度' });
    X.nav('tasks');

    const list = X.el('div', { class:'tasks__list' });
    let doneCount = 0, totalCount = 0;

    D.tasks.forEach(group => {
      list.appendChild(X.el('div', { class:'task-group__label', text: group.g }));
      group.items.forEach(it => {
        const done = X.flag(it.flag);
        totalCount++;
        if (done) doneCount++;
        list.appendChild(X.el('div', { class:'task-item' + (done ? ' is-done' : '') },
          X.el('div', { class:'task-item__tick', html:'✓' }),
          X.el('div', { class:'col grow' },
            X.el('div', { class:'task-item__name', text: it.name }),
            X.el('div', { class:'task-item__desc', text: it.desc })),
          X.el('div', { class:'t-archive', text: done ? '已完成' : '进行中' })
        ));
      });
    });

    root.appendChild(X.el('div', { class:'s__content stack', style:{
      gap:'calc(var(--u) * 1.6)', padding:'calc(var(--u) * 7) calc(var(--u) * 5)'
    } },
      X.el('div', { class:'row', style:{ justifyContent:'space-between', width:'calc(var(--u) * 86)' } },
        X.el('div', { class:'col' },
          X.el('div', { class:'t-kicker', text:'TASKS · 任务清单' }),
          X.el('div', { class:'t-h2', style:{ marginTop:'calc(var(--u) * .6)' },
            text:'已完成 ' + doneCount + ' / ' + totalCount })),
        X.el('div', { class:'s18__legend' },
          X.chip('探索 → 发现 → 修复 → 识别 → 收集 → 解锁'))
      ),
      list,
      X.el('div', { class:'row', style:{ gap:'calc(var(--u) * 2)', marginTop:'calc(var(--u) * 1)' } },
        X.btn('回到地图', { variant:'primary', onClick(){ X.go('s04'); } }),
        X.btn('打开图鉴', { variant:'ghost', onClick(){ X.go('s18'); } }))
    ));
  }
});

/* ------------------------------------------------------------
   我的
   ------------------------------------------------------------ */
X.registerScreen('me', {

  mount(root){
    root.classList.add('me');

    const idCard = X.el('div', { class:'panel me__idcard' },

      X.el('div', { class:'chip chip--gold', text: idn.perk }),
      X.el('div', { class:'rule' }),
      X.el('div', { class:'me__row' },
        X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' }, text:'探索进度' }),
        X.el('b', { class:'t-gold', text: sum.progress + '%' })),
      X.el('div', { class:'me__row' },
        X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' }, text:'记忆值' }),
        X.el('b', { class:'t-gold', text: String(sum.memory) })),
      X.el('div', { class:'me__row' },
        X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' }, text:'碎片' }),
        X.el('b', { class:'t-gold', text: X.shardsFound() + ' / ' + X.shardsTotal() }))
    );

    const sfxSwitch = X.el('div', { class:'switch' + (s.settings.sfx ? ' is-on' : ''), on:{ click(){
      s.settings.sfx = !s.settings.sfx;

    const settings = X.el('div', { class:'panel' },
      X.el('div', { class:'card__no', text:'SETTINGS · 设置与说明' }),
      X.el('div', { class:'col', style:{ marginTop:'calc(var(--u) * 1)' } },
        X.el('div', { class:'me__row' },
          X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' }, text:'音效' }), sfxSwitch),
        X.el('div', { class:'me__row' },
          X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' }, text:'语言' }),
          X.el('span', { class:'t-cap', text:'简体中文' })),
        X.el('div', { class:'me__row' },
          X.el('span', { class:'t-body', style:{ fontSize:'calc(var(--u) * 1.5)' }, text:'存档' }),
          X.el('span', { class:'t-cap', text:'本地进度自动保存' }))
      ),
      X.el('div', { class:'rule' }),

            title:'重置全部进度？',

            actions:[
              { label:'取消', variant:'ghost' },
              { label:'确认重置', variant:'primary', onClick(close){
                  X.reset(); close(); X.toast('进度已重置'); X.go('s01');
                } }

          });
        }}))

    root.appendChild(X.el('div', { class:'s__content stack' },

</script>
<script>
/* ============================================================
   《寻夏》 — main.js
   启动：初始化 → 进入启动页
   ============================================================ */
(function(){
const X = window.X;

document.addEventListener('DOMContentLoaded', boot);

function boot(){
  X.boot();
  X.checkOrientation();

  /* 首次交互解锁音频 */
  document.addEventListener('pointerdown', function once(){
    X.sfx.resume();
    document.removeEventListener('pointerdown', once);
  });

  /* 键盘：Esc 返回、空格继续 */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') X.back('s04');
  });

  /* 调试入口：#s07 直接跳屏（便于策划/视觉评审） */
  const hash = (location.hash || '').replace('#', '');
  if (hash && X.SCREENS[hash]) X.go(hash);
  else X.go('s01');

  window.__XUNXIA__ = X;
}

/* 全局错误兜底：避免单个交互异常导致黑屏 */
window.addEventListener('error', e => {
  console.warn('[xunxia]', e.message);
});

})();

</script>
